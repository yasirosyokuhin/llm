<title>ハコニワ市長 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
:root{
  --ink:#1d2b45;--muted:#62708a;--panel:#fffdf7;--panel2:#f1f5fb;--line:#dfe6f0;
  --accent:#ffb21e;--accent-deep:#e08a00;--go:#2fae55;--go-deep:#1f8a40;--bad:#e5484d;
  --sky:#9fd3f0;--coin:#f5b800;--xp:#6b7cff;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky)}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:var(--ink)}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#c{display:block;width:100%;height:100%;outline:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--xp);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:8px;align-items:center;pointer-events:none;flex-wrap:wrap}
.pill{pointer-events:auto;background:var(--panel);border-radius:999px;height:36px;padding:0 12px 0 4px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(29,43,69,.18);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--panel2)}
.lvl{padding-right:10px;cursor:default}
.lvlbadge{width:30px;height:30px;border-radius:50%;background:var(--xp);color:#fff;display:grid;place-items:center;font-size:15px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.xp{width:64px;height:10px;border-radius:6px;background:var(--panel2);overflow:hidden}
.xp i{display:block;height:100%;width:0;background:var(--xp);border-radius:6px;transition:width .3s}
.spacer{flex:1}
.coins .ic{background:#fff3c4}
.iconbtn{padding:0;width:36px;justify-content:center;font-size:18px}
#utils{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{background:rgba(255,253,247,.92);border-radius:10px;padding:3px 8px;font-size:12px;font-weight:700;display:flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(29,43,69,.12)}
.chip.bad{background:var(--bad);color:#fff}

/* bottom bar */
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
#bottom .grp{display:flex;gap:8px;pointer-events:auto}
.rbtn{width:48px;height:48px;border-radius:16px;background:var(--panel);box-shadow:0 4px 0 rgba(29,43,69,.2);font-size:20px;display:grid;place-items:center;position:relative;font-weight:800}
.rbtn small{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);font-size:10px;background:var(--ink);color:#fff;border-radius:8px;padding:1px 5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rbtn:active,.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(29,43,69,.2)}
.bigbtn{pointer-events:auto;height:64px;min-width:120px;padding:0 22px;border-radius:22px;background:var(--accent);color:#3d2600;font-size:20px;font-weight:800;box-shadow:0 5px 0 var(--accent-deep);display:flex;align-items:center;gap:8px;justify-content:center}
.bigbtn .hammer{font-size:24px}

/* mode bar */
#modebar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:20px;padding:8px 8px 8px 16px;box-shadow:0 4px 0 rgba(29,43,69,.2);max-width:calc(100% - 24px)}
#modeLabel{font-weight:700;font-size:13px;line-height:1.35}
#modeLabel b{display:block;font-size:15px}
.round{width:50px;height:50px;border-radius:16px;font-size:24px;font-weight:800;color:#fff;flex:none}
.round.ok{background:var(--go);box-shadow:0 4px 0 var(--go-deep)}
.round.bad{background:var(--bad);box-shadow:0 4px 0 #b3262b}
.round.ok.done{width:auto;padding:0 16px;font-size:16px}
#modebar .grp{display:flex;gap:8px}

/* sheets */
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(540px,calc(100% - 24px));background:var(--panel);border-radius:22px;box-shadow:0 6px 0 rgba(29,43,69,.2),0 20px 50px rgba(29,43,69,.25);max-height:64%;display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;align-items:center;gap:10px;padding:14px 14px 10px 18px;border-bottom:1px solid var(--line)}
.phead .ttl{font-size:18px;font-weight:800;flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.phead .ttl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xbtn{width:36px;height:36px;border-radius:12px;background:var(--panel2);font-size:16px;font-weight:800;flex:none}
.pbody{overflow:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.sec{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tabs{display:flex;gap:6px;padding:12px 12px 0;overflow-x:auto;scrollbar-width:none}
.tab{padding:7px 12px;border-radius:12px;background:var(--panel2);font-weight:800;font-size:13px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.cards{display:flex;gap:10px;overflow-x:auto;padding:12px;scroll-snap-type:x proximity}
.card{flex:none;width:104px;border-radius:16px;background:var(--panel2);padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;scroll-snap-align:start;box-shadow:inset 0 -3px 0 rgba(29,43,69,.08)}
.card .big{font-size:34px;line-height:1.1}
.card b{font-size:12px;line-height:1.25;min-height:30px;display:flex;align-items:center}
.card .cost{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.card .cost.no{color:var(--bad)}
.card.locked{opacity:.55}
.card .sub{font-size:10px;color:var(--muted);line-height:1.3}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{border-radius:14px;background:var(--panel2);min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;font-size:12px;font-weight:700;text-align:center}
.slot .si{font-size:26px;line-height:1}
.slot.done{background:#dff5e5;box-shadow:inset 0 0 0 2px var(--go)}
.slot.empty{color:var(--muted);border:2px dashed var(--line);background:transparent}
.slot.add{border:2px dashed var(--accent);background:#fff7e3;color:#8a5a00}
.slot.wait{opacity:.7}
.bar{width:100%;height:7px;border-radius:5px;background:#dce3ee;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--go);border-radius:5px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.choice{border-radius:14px;background:var(--panel2);padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;box-shadow:inset 0 -3px 0 rgba(29,43,69,.08)}
.choice .ci{font-size:26px}
.choice b{font-size:13px}
.choice small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.choice .needs{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.choice .needs .no{color:var(--bad)}
.choice.locked{opacity:.5;cursor:default}

.stat{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.stat .v{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.ok-t{color:var(--go-deep)}.bad-t{color:var(--bad)}.mut-t{color:var(--muted)}
.hapbar{height:10px;border-radius:6px;background:#dce3ee;overflow:hidden}
.hapbar i{display:block;height:100%;border-radius:6px}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.req{border-radius:14px;background:var(--panel2);padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 0 0 2px transparent}
.req .ri{font-size:26px}
.req small{font-weight:800;font-variant-numeric:tabular-nums;color:var(--bad)}
.req.ok small{color:var(--go-deep)}
.req.ok{box-shadow:inset 0 0 0 2px var(--go)}
.req em{font-style:normal;font-size:11px;color:var(--muted)}
.act{height:50px;border-radius:16px;background:var(--go);color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--go-deep);padding:0 16px}
.act.alt{background:var(--accent);color:#3d2600;box-shadow:0 4px 0 var(--accent-deep)}
.act.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.act.danger{background:var(--bad);box-shadow:0 4px 0 #b3262b}
.act:active{transform:translateY(3px);box-shadow:none}
.stars{color:var(--coin);font-size:16px;letter-spacing:1px}
.stars .off{color:#d4dae4}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.item{border-radius:14px;background:var(--panel2);padding:8px 10px;display:flex;align-items:center;gap:8px}
.item .ii{font-size:24px}
.item div{flex:1;min-width:0;font-size:12px;line-height:1.3}
.item div b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.sell{font-size:11px;font-weight:800;background:#fff3c4;border-radius:10px;padding:5px 7px;white-space:nowrap}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.cap{display:flex;align-items:center;gap:10px;font-weight:800;font-variant-numeric:tabular-nums}
.cap .bar{height:10px;flex:1}

/* world bubbles */
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;background:#fff;border-radius:14px;padding:3px 8px;font-size:18px;font-weight:800;line-height:1.3;box-shadow:0 3px 0 rgba(29,43,69,.25);white-space:nowrap;will-change:transform}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:inherit}
.bub{border-color:#fff}
.bub.warn{background:var(--bad);border-color:var(--bad);color:#fff;font-size:15px}
.bub.up{background:var(--go);border-color:var(--go);color:#fff}
.bub.coin{background:#fff3c4;border-color:#fff3c4;font-size:14px;font-variant-numeric:tabular-nums}
.bub.idle{font-size:13px;opacity:.85}
.bub.ready{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{margin-top:-5px}}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(29,43,69,.55),0 0 6px rgba(29,43,69,.4);pointer-events:none;animation:rise 1.3s ease-out forwards;white-space:nowrap;font-variant-numeric:tabular-nums}
@keyframes rise{from{opacity:0;margin-top:0}15%{opacity:1}to{opacity:0;margin-top:-70px}}

#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:14px;padding:9px 16px;border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}

#modal{position:absolute;inset:0;background:rgba(29,43,69,.45);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border-radius:24px;padding:22px 20px 18px;width:min(420px,100%);max-height:86%;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 0 rgba(29,43,69,.25)}
.mbox h2{margin:0;font-size:24px;font-weight:800;text-wrap:balance}
.mbox p{margin:0;font-size:14px;line-height:1.7}
.mbox ul{margin:0;padding-left:1.2em;font-size:14px;line-height:1.8}
.lvbig{font-size:56px;font-weight:800;color:var(--xp);line-height:1;text-align:center}
.unl{display:flex;flex-wrap:wrap;gap:8px}
.unl span{background:var(--panel2);border-radius:12px;padding:6px 10px;font-size:13px;font-weight:700}
#fatal{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:var(--sky);z-index:10}
#fatal .mbox{text-align:center}
#fatal code{display:block;font-size:12px;background:var(--panel2);border-radius:10px;padding:8px;word-break:break-all;text-align:left;color:var(--bad)}
@media (prefers-reduced-motion:reduce){.bub.ready{animation:none}.float{animation-duration:.01s}}
@media (max-width:420px){#hud{gap:6px;padding-left:10px;padding-right:10px}.pill{height:32px;font-size:13px;padding-right:9px}.lvl{padding-right:8px}.pill .ic{width:24px;height:24px;font-size:13px}.lvlbadge{width:26px;height:26px;font-size:13px}.xp{width:34px}.bigbtn{height:58px;min-width:104px;font-size:18px}}
</style>

<div id="app">
  <canvas id="c" tabindex="0" aria-label="街のマップ"></canvas>
  <div id="bubbles"></div>
  <div id="hud">
    <div class="pill lvl" title="市長レベル"><div class="lvlbadge" id="lvl">1</div><div class="xp"><i id="xpbar"></i></div></div>
    <div class="pill" title="人口"><span class="ic">👥</span><span id="pop">0</span></div>
    <div class="pill" title="幸福度"><span class="ic" id="hapIc">🙂</span><span id="hap">0%</span></div>
    <div class="spacer"></div>
    <div class="pill coins" title="所持金"><span class="ic">🪙</span><span id="coins">0</span></div>
    <button class="pill iconbtn" id="menuBtn" aria-label="メニュー">☰</button>
    <div id="utils"></div>
  </div>
  <div id="bottom">
    <div class="grp"><button class="rbtn" id="rotL" aria-label="左に回転">↺</button><button class="rbtn" id="rotR" aria-label="右に回転">↻</button></div>
    <button class="bigbtn" id="buildBtn"><span class="hammer">🔨</span>建設</button>
    <div class="grp"><button class="rbtn" id="storeBtn" aria-label="倉庫">📦<small id="storeCnt">0/60</small></button><button class="rbtn" id="dozeBtn" aria-label="撤去">🚜</button></div>
  </div>
  <div id="modebar" hidden>
    <div id="modeLabel"></div>
    <div class="grp"><button class="round bad" id="cancelBtn" aria-label="キャンセル">✕</button><button class="round ok" id="okBtn" aria-label="決定">✓</button></div>
  </div>
  <div id="drawer" class="sheet" hidden>
    <div class="phead"><div class="ttl"><span>建設メニュー</span></div><button class="xbtn" id="drawerClose" aria-label="閉じる">✕</button></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="cards" id="cards"></div>
  </div>
  <div id="panel" class="sheet" hidden>
    <div class="phead"><div class="ttl" id="ptitle"></div><button class="xbtn" id="pclose" aria-label="閉じる">✕</button></div>
    <div class="pbody" id="pbody"></div>
  </div>
  <div id="toast" role="status"></div>
  <div id="modal" hidden><div class="mbox" id="mbox"></div></div>
  <div id="fatal"><div class="mbox"><h2 id="fatalTitle">街を読み込み中…</h2><p id="fatalMsg">3Dエンジンを準備しています。</p><code id="fatalCode" hidden></code><button class="act" id="fatalReload" hidden>再読み込み</button></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function showFatal(title, msg, detail) {
  const f = document.getElementById('fatal'); if (!f) return;
  f.hidden = false;
  document.getElementById('fatalTitle').textContent = title;
  document.getElementById('fatalMsg').textContent = msg;
  const c = document.getElementById('fatalCode');
  if (detail) { c.textContent = detail; c.hidden = false; }
  const r = document.getElementById('fatalReload'); r.hidden = false; r.onclick = () => location.reload();
}
function ensureThree(cb) {
  if (window.THREE) { cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
  s.onload = () => window.THREE ? cb() : showFatal('3Dエンジンを読み込めませんでした', '通信環境を確認して再読み込みしてください。');
  s.onerror = () => showFatal('3Dエンジンを読み込めませんでした', 'three.js の配信サーバーに接続できません。通信環境を確認して再読み込みしてください。');
  document.head.appendChild(s);
}
function startGame() {
'use strict';

/* ============================================================
   データ定義
   ============================================================ */
const N = 32, HALF = N / 2;
const ENTRY = { x: 16, z: 0 };            // 高速道路と接続する入口タイル
const SAVE_KEY = 'hakoniwa-mayor-v1';
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

const ITEMS = {
  metal:    { n:'金属',        i:'🔩', t:6,  raw:1, v:8,   lv:1 },
  wood:     { n:'木材',        i:'🪵', t:10, raw:1, v:12,  lv:1 },
  plastic:  { n:'プラスチック', i:'🧴', t:15, raw:1, v:18,  lv:2 },
  seeds:    { n:'種',          i:'🌱', t:20, raw:1, v:24,  lv:4 },
  minerals: { n:'鉱物',        i:'🪨', t:24, raw:1, v:30,  lv:5 },
  nails:    { n:'釘',          i:'📌', t:10, shop:'supplies',  need:{metal:2},                    v:40,  lv:2 },
  planks:   { n:'板材',        i:'🟫', t:14, shop:'supplies',  need:{wood:2},                     v:60,  lv:2 },
  bricks:   { n:'レンガ',      i:'🧱', t:18, shop:'supplies',  need:{minerals:2},                 v:90,  lv:5 },
  hammer:   { n:'ハンマー',    i:'🔨', t:16, shop:'hardware',  need:{metal:1,wood:1},             v:70,  lv:3 },
  tape:     { n:'巻尺',        i:'📏', t:20, shop:'hardware',  need:{metal:1,plastic:1},          v:90,  lv:3 },
  shovel:   { n:'シャベル',    i:'🪏', t:26, shop:'hardware',  need:{metal:1,wood:1,plastic:1},   v:120, lv:4 },
  veg:      { n:'野菜',        i:'🥕', t:22, shop:'farm',      need:{seeds:2},                    v:110, lv:4 },
  flour:    { n:'小麦粉',      i:'🌾', t:28, shop:'farm',      need:{seeds:2,plastic:1},          v:140, lv:5 },
  chair:    { n:'椅子',        i:'🪑', t:24, shop:'furniture', need:{wood:2,nails:1},             v:150, lv:6 },
  bed:      { n:'ベッド',      i:'🛏️', t:32, shop:'furniture', need:{planks:1,nails:1,plastic:1}, v:190, lv:6 },
};
const ITEM_KEYS = Object.keys(ITEMS);
const RAW = ITEM_KEYS.filter(k => ITEMS[k].raw);

const B = {
  road:      { n:'道路',           ic:'🛣️', cat:'base', cost:10,   w:1, lv:1, desc:'ドラッグで連続敷設' },
  res:       { n:'住宅区画',       ic:'🏠', cat:'base', cost:120,  w:2, lv:1, desc:'資材でアップグレード' },
  factory:   { n:'工場',           ic:'🏭', cat:'ind',  cost:500,  w:2, lv:1, grow:.8, pollute:12, desc:'原材料を生産' },
  supplies:  { n:'建材店',         ic:'🧰', cat:'com',  cost:800,  w:2, lv:2, grow:1, desc:'釘・板材・レンガ' },
  hardware:  { n:'工具店',         ic:'🔧', cat:'com',  cost:1200, w:2, lv:3, grow:1, desc:'ハンマー・巻尺' },
  farm:      { n:'ファーマーズマーケット', ic:'🥬', cat:'com', cost:1600, w:2, lv:4, grow:1, desc:'野菜・小麦粉' },
  furniture: { n:'家具店',         ic:'🛋️', cat:'com',  cost:2200, w:2, lv:6, grow:1, desc:'椅子・ベッド' },
  wind:      { n:'風力発電所',     ic:'🌬️', cat:'svc',  cost:300,  w:2, lv:1, util:'power',  cap:12 },
  coal:      { n:'火力発電所',     ic:'⚡',  cat:'svc',  cost:1800, w:2, lv:5, util:'power',  cap:45, pollute:15 },
  wtower:    { n:'給水塔',         ic:'🚰', cat:'svc',  cost:300,  w:2, lv:1, util:'water',  cap:12 },
  wplant:    { n:'浄水場',         ic:'💧', cat:'svc',  cost:1800, w:2, lv:5, util:'water',  cap:45 },

function recompute() {
  dirty = false;
  const conn = new Set(), st = [];
  if (isRoad(ENTRY.x, ENTRY.z)) { conn.add(gi(ENTRY.x, ENTRY.z)); st.push([ENTRY.x, ENTRY.z]); }
  while (st.length) {
    const [x, z] = st.pop();
    for (const [dx, dz] of DIRS) { const nx = x + dx, nz = z + dz; if (isRoad(nx, nz) && !conn.has(gi(nx, nz))) { conn.add(gi(nx, nz)); st.push([nx, nz]); } }
  }
  connSet = conn;
  for (const b of S.b) b.conn = perimeter(b.t, b.x, b.z).some(([x, z]) => inb(x, z) && conn.has(gi(x, z)));

  const sup = { power:0, water:0, sewage:0, waste:0 }, dem = { power:0, water:0, sewage:0, waste:0 }, used = { power:0, water:0, sewage:0, waste:0 };
  for (const b of S.b) { const d = B[b.t]; if (d.util && b.conn) sup[d.util] += d.cap; }
  const utils = Object.keys(UTILS).filter(utilOn);
  const homes = S.b.filter(b => b.t === 'res').sort((a, b) => a.id - b.id);
  let pop = 0, hapSum = 0, rate = 0;
  for (const r of homes) {
    r.lack = [];
    const u = RES_USE[r.lvl];
    for (const k of utils) { dem[k] += u; if (r.conn && used[k] + u <= sup[k]) used[k] += u; else r.lack.push(k); }
    r.active = r.conn && !r.lack.length;
    let hap = 35; r.cov = {};
    for (const c of Object.keys(COVERS)) {
      if (!coverOn(c)) { hap += 15; r.cov[c] = null; continue; }
      const ok = S.b.some(s => B[s.t].cover === c && s.conn && dist(s, r) <= B[s.t].r);
      r.cov[c] = ok; if (ok) hap += 15;
    }
    let joy = 0; for (const s of S.b) if (B[s.t].joy && dist(s, r) <= B[s.t].r) joy += B[s.t].joy;
    r.joy = Math.min(25, joy); hap += r.joy;
    let poll = 0; for (const s of S.b) if (B[s.t].pollute && dist(s, r) <= 3.6) poll += B[s.t].pollute;
    r.poll = Math.min(40, poll); hap -= r.poll;
    r.hap = clamp(Math.round(hap), 0, 100);
    if (r.active) { pop += RES_POP[r.lvl]; hapSum += r.hap; rate += RES_POP[r.lvl] * .012 * (.5 + r.hap / 100); }
  }

  if (ch && !ch.conn) rate = 0;
  stats = { sup, dem, pop, hap: homes.length ? Math.round(hapSum / homes.length) : 0, rate };
  updateHud();
}

}

function facing(b) {
  const w = B[b.t].w, sides = [
    [0, () => { for (let i = 0; i < w; i++) if (isRoad(b.x + i, b.z + w)) return 1; }],
    [Math.PI / 2, () => { for (let i = 0; i < w; i++) if (isRoad(b.x + w, b.z + i)) return 1; }],
    [Math.PI, () => { for (let i = 0; i < w; i++) if (isRoad(b.x + i, b.z - 1)) return 1; }],
    [-Math.PI / 2, () => { for (let i = 0; i < w; i++) if (isRoad(b.x - 1, b.z + i)) return 1; }],
  ];
  for (const [a, f] of sides) if (f()) return a;
  return 0;
}

function attachMesh(b) {

  const g = makeMesh(b), w = B[b.t].w;
  g.position.set(b.x - HALF + w / 2, 0, b.z - HALF + w / 2);
  g.rotation.y = facing(b);
  g.userData.bid = b.id;
  buildRoot.add(g);
  g.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(g);
  b.topY = bb.max.y;
  b.mesh = g;
}

function occupy(b, v) { for (const [x, z] of tilesOf(b.t, b.x, b.z)) grid[gi(x, z)] = v; }

function rebuildAll() {
  grid.fill(null);
  for (const [k, g] of roadMeshes) roadRoot.remove(g);
  roadMeshes.clear();
  while (buildRoot.children.length) buildRoot.remove(buildRoot.children[0]);
  for (const k of S.roads) { const [x, z] = k.split(',').map(Number); if (inb(x, z)) grid[gi(x, z)] = 'road'; }
  if (!isRoad(ENTRY.x, ENTRY.z)) { grid[gi(ENTRY.x, ENTRY.z)] = 'road'; S.roads.push(key(ENTRY.x, ENTRY.z)); }
  for (const b of S.b) { b.mesh = null; occupy(b, b); }
  for (const k of S.roads) { const [x, z] = k.split(',').map(Number); updateRoad(x, z); }
  for (const b of S.b) attachMesh(b);

}

const smokeGeo = new THREE.IcosahedronGeometry(1, 0);
const puffs = [];
let smokeTimer = 0;
function emitSmoke(dt) {
  smokeTimer += dt;
  if (smokeTimer < .35) return;
  smokeTimer = 0;
  const now = Date.now(), v = new THREE.Vector3();
  for (const b of S.b) {
    if (!b.mesh || !b.mesh.userData.smoke) continue;
    if (b.t === 'factory' && !(b.q && b.q.some(q => q.e > now))) continue;
    if (!b.conn) continue;
    for (const o of b.mesh.userData.smoke) {
      if (puffs.length > 90) return;
      o.getWorldPosition(v);
      const m = new THREE.Mesh(smokeGeo, new THREE.MeshLambertMaterial({ color: o.userData.steam ? 0xffffff : 0xd6d6d6, transparent: true, opacity: .8, depthWrite: false }));
      m.position.copy(v); m.scale.setScalar(.08); scene.add(m);
      puffs.push({ m, life: 0, vx: .15 + Math.random() * .1, vz: (Math.random() - .5) * .1 });
    }
  }
}
function updateSmoke(dt) {
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i]; p.life += dt;
    p.m.position.y += dt * .5; p.m.position.x += dt * p.vx; p.m.position.z += dt * p.vz;
    p.m.scale.setScalar(.08 + p.life * .14);
    p.m.material.opacity = Math.max(0, .75 - p.life * .3);
    if (p.life > 2.5) { scene.remove(p.m); p.m.material.dispose(); puffs.splice(i, 1); }
  }
}

  for (const [id, o] of bubbles) if (!seen.has(id)) { o.el.remove(); bubbles.delete(id); }
}
const pv = new THREE.Vector3();
function positionBubbles() {
  const W = canvas.clientWidth, H = canvas.clientHeight;
  for (const [id, o] of bubbles) {
    if (o.el.hidden) continue;
    const b = byId(id); if (!b || !b.mesh) continue;
    pv.set(b.mesh.position.x, (b.topY || 1) + .3, b.mesh.position.z).project(camera);
    if (pv.z > 1 || pv.x < -1.1 || pv.x > 1.1 || pv.y < -1.1 || pv.y > 1.1) { o.el.style.visibility = 'hidden'; continue; }
    o.el.style.visibility = '';
    o.el.style.transform = `translate(${((pv.x + 1) / 2 * W).toFixed(1)}px,${((1 - pv.y) / 2 * H).toFixed(1)}px) translate(-50%,-100%)`;
  }
}
function floatWorld(b, text, delay = 0) {
  if (!b || !b.mesh) return;
  setTimeout(() => {
    pv.set(b.mesh.position.x, (b.topY || 1) + .2, b.mesh.position.z).project(camera);
    const el = document.createElement('div'); el.className = 'float'; el.textContent = text;
    el.style.left = ((pv.x + 1) / 2 * canvas.clientWidth) + 'px'; el.style.top = ((1 - pv.y) / 2 * canvas.clientHeight) + 'px';
    $('#bubbles').appendChild(el); setTimeout(() => el.remove(), 1400);
  }, delay);
}

function slotsHtml(b) {

    const q = b.q[i];

    if (q.e <= now) h += `<button class="slot done" data-act="collect"><span class="si">${it.i}</span>完成！</button>`;
    else if (seq && q.s > now) h += `<div class="slot wait"><span class="si">${it.i}</span>待機中</div>`;

}
function updateProgress() {
  if ($('#panel').hidden) return;
  if (panelSignature() !== panelSig) { renderPanel(); return; }
  const now = Date.now();
  for (const i of document.querySelectorAll('#pbody .bar i[data-e]')) { const s = +i.dataset.s, e = +i.dataset.e; i.style.width = clamp((now - s) / (e - s) * 100, 0, 100) + '%'; }
  for (const el of document.querySelectorAll('#pbody [data-left]')) el.textContent = fmtT((+el.dataset.left - now) / 1000);
}

/* ============================================================
   ループ
   ============================================================ */
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
let lastW = 0, lastH = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);

let last = performance.now(), tickAcc = 0, saveAcc = 0;
let frameErr = false;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (canvas.clientWidth !== lastW || canvas.clientHeight !== lastH) { lastW = canvas.clientWidth; lastH = canvas.clientHeight; resize(); }
  try {
  // カメラの補間
  cam.yaw += (cam.yawT - cam.yaw) * Math.min(1, dt * 8);
  cam.dist += (cam.distT - cam.dist) * Math.min(1, dt * 8);
  updateCam();
  // 税の蓄積
  const capTax = Math.max(300, stats.rate * 900);
  if (S.tax < capTax) S.tax = Math.min(capTax, S.tax + stats.rate * dt);
  // アニメーション
  for (const b of S.b) if (b.mesh && b.mesh.userData.spin) for (const h of b.mesh.userData.spin) h.rotation.z += dt * (b.conn ? 2.2 : .3);
  emitSmoke(dt); updateSmoke(dt); updateCars(dt);
  tickAcc += dt; saveAcc += dt;
  if (tickAcc > .25) {
    tickAcc = 0;
    if (dirty) recompute();
    if (treesDirty) { treesDirty = false; rebuildTrees(); }
    refreshBubbles(); updateProgress(); updateHud();
  }
  if (saveAcc > 4) { saveAcc = 0; save(); }
  renderer.render(scene, camera);
  positionBubbles();
  if (!firstFrame) { firstFrame = true; document.getElementById('fatal').hidden = true; }
  } catch (e) {
    if (!frameErr) { frameErr = true; console.error(e); showFatal('エラーが発生しました', '下の内容を教えてください。', String(e && e.stack || e)); }
  }
}
let firstFrame = false;

/* ============================================================
   起動
   ============================================================ */
const loaded = load();
if (!loaded) newState();
rebuildAll();
if (loaded && S.t) { const away = Math.max(0, (Date.now() - S.t) / 1000); S.tax = Math.min(Math.max(300, stats.rate * 900), S.tax + stats.rate * away); }
resize(); updateCam(); updateHud(); refreshBubbles();
for (let i = 0; i < 6; i++) spawnCar();
requestAnimationFrame(frame);
if (!loaded) setTimeout(() => toast('ようこそ市長！ 市役所をタップして税金を回収しましょう'), 600);
}
ensureThree(() => {
  try { startGame(); }
  catch (e) { console.error(e); showFatal('起動時にエラーが発生しました', '下の内容を教えてください。', String(e && e.stack || e)); }
});
