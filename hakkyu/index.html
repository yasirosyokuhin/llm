<title>白球ローグ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;700;800;900&family=Teko:wght@500;600;700&display=swap">
<style>
/* Layout: a full-screen 3D stadium canvas with a TV-broadcast HUD on top; menus are navy/gold panels slanted like sports-broadcast graphics. Single deliberate night-game look. */
:root{
  --navy:#0a1533;--navy-2:#122556;--navy-3:#1d3a80;--glass:rgba(8,18,46,.86);
  --gold:#f6c626;--gold-2:#ffe27a;--red:#e8333c;--red-2:#a3161e;
  --white:#f6f8ff;--muted:#93a4cc;--paper:#ffffff;--paper-2:#eef2fb;--ink:#0a1533;--line:#d7def0;
  --good:#2fbf62;--warn:#f39a1e;--bad:#e8333c;--blue:#2f7fe8;
  --f-disp:"Dela Gothic One","M PLUS 1p","Hiragino Sans",sans-serif;
  --f-body:"M PLUS 1p","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Teko","M PLUS 1p",ui-sans-serif,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
table{color:inherit;font-family:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--navy)}
body{font-family:var(--f-body);color:var(--white)}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{display:block;width:100%;height:100%;touch-action:none;outline:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.38}

/* ---------- broadcast HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#bug{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;align-items:stretch;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
#bug .tm{display:flex;flex-direction:column;background:var(--glass);border-radius:8px 0 0 8px;overflow:hidden}
#bug .row{display:flex;align-items:center;height:26px}
#bug .row i{width:6px;align-self:stretch}
#bug .row b{font-weight:900;font-size:14px;padding:0 8px 0 7px;min-width:34px;letter-spacing:.04em}
#bug .row span{font-family:var(--f-num);font-size:26px;line-height:1;font-weight:600;width:30px;text-align:center;background:rgba(255,255,255,.07);align-self:stretch;display:grid;place-items:center;padding-top:3px;font-variant-numeric:tabular-nums}
#bug .row.bat span{color:var(--gold)}
#bug .inn{background:var(--navy-3);display:flex;flex-direction:column;align-items:center;justify-content:center;width:34px;font-family:var(--f-num);font-size:24px;line-height:.8;font-weight:600}
#bug .inn small{font-size:12px;color:var(--gold);line-height:1}
#bug .cn{background:var(--glass);border-radius:0 8px 8px 0;display:flex;align-items:center;gap:8px;padding:0 10px 0 8px}
.dia{position:relative;width:36px;height:36px}
.dia i{position:absolute;width:12px;height:12px;border:2px solid rgba(255,255,255,.5);transform:rotate(45deg);border-radius:2px}
.dia i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.bso{display:grid;grid-template-columns:auto auto;gap:2px 5px;align-items:center;font-family:var(--f-num);font-size:15px;line-height:1;font-weight:600}
.bso i{display:inline-block;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);margin-right:3px}
.bso .b i.on{background:#3fe27a}.bso .s i.on{background:var(--gold)}.bso .o i.on{background:var(--red)}
#pc{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--glass);border-radius:8px;padding:6px 10px;min-width:118px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
#pc .nm{font-weight:900;font-size:14px;display:flex;gap:6px;align-items:baseline;justify-content:flex-end;white-space:nowrap}
#pc .nm small{color:var(--muted);font-size:11px;font-weight:700}
#pc .ln{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-num);font-size:18px;line-height:1;margin-top:3px}
#pc .ln em{font-style:normal;color:var(--muted);font-family:var(--f-body);font-size:10px;font-weight:700;align-self:center}
.stam{height:5px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden;margin-top:4px}
.stam i{display:block;height:100%}
#l3{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 112px);max-width:min(440px,calc(100% - 20px));transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s;filter:drop-shadow(0 5px 12px rgba(0,0,0,.5))}
#l3.off{transform:translateX(-115%);opacity:0}
#l3 .top{display:flex;align-items:stretch}
#l3 .no{background:var(--gold);color:var(--ink);font-family:var(--f-num);font-size:34px;line-height:1;font-weight:700;padding:6px 10px 0;clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}
#l3 .nb{background:linear-gradient(100deg,var(--navy-3),var(--navy-2) 70%);padding:4px 26px 4px 12px;margin-left:-6px;clip-path:polygon(4% 0,100% 0,94% 100%,0 100%);display:flex;flex-direction:column;justify-content:center;min-width:0}
#l3 .nb small{font-size:11px;color:var(--gold-2);font-weight:800;letter-spacing:.06em}
#l3 .nb b{font-size:21px;font-weight:900;line-height:1.1;white-space:nowrap}
#l3 .ab{background:var(--glass);padding:5px 10px;display:flex;flex-wrap:wrap;gap:4px 9px;align-items:center;font-size:11px;border-radius:0 0 8px 8px;margin-right:20px}
#l3 .ab .k{color:var(--muted);font-weight:800}
#l3 .avg{font-family:var(--f-num);font-size:17px;line-height:1;color:var(--gold-2)}
#spd{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 112px);text-align:right;transition:opacity .3s,transform .3s;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
#spd.off{opacity:0;transform:translateY(8px)}
#spd .v{background:var(--glass);border-radius:8px 8px 0 8px;padding:2px 10px 0;font-family:var(--f-num);font-size:40px;line-height:1;font-weight:600}
#spd .v small{font-size:16px;color:var(--muted);margin-left:2px}
#spd .t{display:inline-block;background:var(--red);font-weight:900;font-size:12px;padding:2px 10px;border-radius:0 0 6px 6px}
.g{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:5px;font-family:var(--f-disp);font-size:12px;color:#fff;padding:0 2px;text-shadow:0 1px 0 rgba(0,0,0,.3);line-height:1}
.g-S{background:linear-gradient(#ffd84a,#e0a300)}.g-A{background:#f0476b}.g-B{background:#f5792a}.g-C{background:#e5bd15}.g-D{background:#8cc532}.g-E{background:#2fb35e}.g-F{background:#2f88e0}.g-G{background:#7f8aa3}
.gv{font-family:var(--f-num);font-size:15px;line-height:1;margin-left:2px;font-weight:600}
.traj{display:inline-flex;align-items:center;gap:2px;font-family:var(--f-num);font-size:17px;line-height:1;color:var(--gold-2)}
.chips{display:flex;gap:3px;flex-wrap:wrap}
.chip{background:#2f7fe8;color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:800;white-space:nowrap}
.chip.gold{background:linear-gradient(90deg,#e0a300,#ffd84a,#e0a300);color:var(--ink)}
.chip.p{background:#d8344a}
.chip.i{background:#7b5ad8}
.cond{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-weight:900;font-size:13px;color:#fff;line-height:1;vertical-align:middle}
.c0{background:#4f5fd0}.c1{background:#3fa0e0}.c2{background:#8e98ad}.c3{background:#f39a1e}.c4{background:#ec2f4b}

/* controls */
#ctrl{position:absolute;left:0;right:0;bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));display:flex;align-items:flex-end;justify-content:space-between;gap:8px;pointer-events:none}
#ctrl .grp{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;align-items:flex-end;max-width:calc(100% - 110px)}
.cb{background:var(--glass);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:8px 11px;font-weight:800;font-size:13px;white-space:nowrap;color:var(--white)}
.cb.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.cb:active{transform:translateY(2px)}
.seg{display:flex;border-radius:10px;overflow:hidden}
.seg .cb{border-radius:0}
.big{pointer-events:auto;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6870,var(--red) 55%,var(--red-2));color:#fff;font-weight:900;font-size:16px;box-shadow:0 6px 0 #6b0d12,0 0 0 4px rgba(255,255,255,.9),0 10px 20px rgba(0,0,0,.4);flex:none;letter-spacing:.04em}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #6b0d12,0 0 0 4px rgba(255,255,255,.9)}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);color:#fff;font-size:11px;font-weight:800;background:rgba(8,18,46,.6);border-radius:999px;padding:4px 12px;pointer-events:none;white-space:nowrap;transition:opacity .6s;max-width:94vw;overflow:hidden;text-overflow:ellipsis}

/* banners */
#banner{position:absolute;left:0;right:0;top:30%;display:grid;place-items:center;pointer-events:none;z-index:3}
.bn{display:flex;flex-direction:column;align-items:center;gap:6px;animation:bnIn .45s cubic-bezier(.2,1.4,.3,1) both;padding:10px 12vw;background:linear-gradient(90deg,transparent,rgba(8,18,46,.7) 22%,rgba(8,18,46,.7) 78%,transparent)}
.bn.out{animation:bnOut .3s ease-in both}
.bn .m{font-family:var(--f-disp);font-size:clamp(40px,12vw,92px);line-height:1.1;transform:skewX(-10deg);letter-spacing:.02em;white-space:nowrap;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 10px 24px rgba(0,0,0,.5)}
.bn .s{background:var(--glass);padding:5px 16px;font-weight:900;font-size:clamp(14px,3.8vw,20px);transform:skewX(-10deg);border-left:5px solid var(--gold);max-width:92vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn .r{font-family:var(--f-num);font-weight:700;font-size:30px;line-height:1;color:var(--gold);transform:skewX(-10deg);text-shadow:0 3px 0 var(--ink)}
.bn.hr .m{background:linear-gradient(180deg,#fff6c0,#ffd02a 45%,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;text-shadow:none;filter:drop-shadow(0 4px 0 var(--ink)) drop-shadow(0 0 2px var(--ink)) drop-shadow(0 0 2px var(--ink))}
.bn.hit .m{color:#fff}
.bn.out2 .m{color:#cfd8f0;font-size:clamp(32px,9vw,64px)}
.bn.k .m{color:var(--red);-webkit-text-stroke:3px #fff}
.bn.chance .m{color:var(--gold);animation:pulse .5s ease-in-out infinite alternate}
.bn.pinch .m{color:#7fd0ff}
.bn.chg .m{color:#fff;font-size:clamp(30px,8.5vw,60px)}
@keyframes bnIn{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:none}}
@keyframes bnOut{to{opacity:0;transform:translateX(30%) scale(.9)}}
@keyframes pulse{to{transform:skewX(-10deg) scale(1.06)}}

/* ---------- menus ---------- */
#screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,rgba(10,21,51,.3),rgba(10,21,51,.8) 32%,rgba(10,21,51,.95));padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.logo{margin:6vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.logo .en{font-family:var(--f-num);font-weight:600;font-size:20px;letter-spacing:.5em;color:var(--gold);padding-left:.5em}
.logo h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:clamp(56px,16vw,120px);line-height:1.05;transform:skewX(-9deg);color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--red),0 12px 0 var(--ink),0 18px 30px rgba(0,0,0,.6)}
.logo .tag{background:var(--red);color:#fff;font-weight:900;padding:4px 16px;transform:skewX(-9deg);font-size:14px;letter-spacing:.1em}
.lead{text-align:center;color:#c9d4f0;font-size:14px;line-height:1.8;max-width:32em;margin:0 auto;text-wrap:pretty}
.h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
h2{font-family:var(--f-disp);font-weight:400;font-size:26px;margin:0;color:#fff;transform:skewX(-8deg);text-wrap:balance}
h3{font-weight:900;font-size:15px;margin:0;color:var(--gold);letter-spacing:.06em;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:14px;height:4px;background:var(--gold);transform:skewX(-20deg);flex:none}
.btn{display:block;width:100%;background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--ink);font-weight:900;font-size:17px;padding:14px 18px;clip-path:polygon(3% 0,100% 0,97% 100%,0 100%);letter-spacing:.06em}
.btn.red{background:linear-gradient(180deg,#ff5a62,var(--red));color:#fff}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff}
.btn:active{filter:brightness(.88)}
.col{display:flex;flex-direction:column;gap:10px;max-width:360px;width:100%;margin:0 auto}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--glass);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;white-space:nowrap;display:flex;gap:6px;align-items:center}
.pill b{font-family:var(--f-num);font-size:20px;line-height:.8;color:var(--gold);font-weight:600}
.hearts i{width:12px;height:12px;border-radius:50%;background:var(--red);display:inline-block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.hearts i.off{background:rgba(255,255,255,.15);box-shadow:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{position:relative;background:linear-gradient(160deg,#ffffff,#e9eefb);color:var(--ink);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:0 5px 0 #8796bf,0 10px 20px rgba(0,0,0,.25);transition:transform .15s}
.opt:hover{transform:translateY(-2px)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #8796bf}
.opt:disabled{transform:none}
.opt.gold{background:linear-gradient(160deg,#fff7d1,#ffe48a);box-shadow:0 5px 0 #b48a12,0 10px 20px rgba(0,0,0,.25)}
.opt .ot{display:flex;align-items:center;gap:12px;font-weight:900;font-size:16px;line-height:1.3}
.opt p{margin:0;font-size:13px;line-height:1.6;color:#4a5878}
.opt .price{font-family:var(--f-num);font-weight:600;font-size:22px;line-height:1;color:#9a6c00}
.kb{width:42px;height:42px;display:grid;place-items:center;flex:none;position:relative;font-family:var(--f-disp);font-size:18px;color:#fff}
.kb::before{content:"";position:absolute;inset:5px;transform:rotate(45deg);border-radius:6px;background:var(--kc,#2f7fe8);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.kb span{position:relative}
.track{display:flex;align-items:center;gap:3px;background:var(--glass);border-radius:12px;padding:12px;overflow-x:auto}
.track .dot{width:32px;height:32px;display:grid;place-items:center;flex:none;position:relative;font-family:var(--f-disp);font-size:13px}
.track .dot::before{content:"";position:absolute;inset:4px;transform:rotate(45deg);background:var(--kc,rgba(255,255,255,.14));border-radius:4px}
.track .dot span{position:relative}
.track .dot.cur::after{content:"";position:absolute;inset:0;transform:rotate(45deg);border:2px solid var(--gold);border-radius:6px}
.track .ln{flex:1;min-width:6px;height:3px;background:rgba(255,255,255,.14)}
.panel{background:var(--paper);color:var(--ink);border-radius:12px;padding:14px;min-width:0}
.panel p{margin:0;line-height:1.75;font-size:14px}
.dark{background:var(--glass);color:var(--white);border:1px solid rgba(255,255,255,.1)}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
.tbl th{font-size:10px;color:#6b789a;font-weight:800}
.tbl .gv{color:#4a5878}
.mini{font-size:12px;color:var(--muted);margin:0}
.log{font-size:13px;line-height:1.85;max-height:40vh;overflow:auto;background:rgba(255,255,255,.06);border-radius:8px;padding:8px 12px}
.log b{color:var(--gold)}
.ls{font-family:var(--f-num);background:rgba(0,0,0,.25);border-radius:8px;padding:8px;overflow-x:auto}
.ls table{border-collapse:collapse;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.ls td{padding:3px 8px;text-align:center}
.ls td:first-child{text-align:left;font-family:var(--f-body);font-weight:900;font-size:13px}
.ls td.r{color:var(--gold)}
#modal{position:absolute;inset:0;background:rgba(4,10,28,.66);display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));z-index:5}
#modal .box{background:linear-gradient(170deg,var(--navy-2),var(--navy));border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:18px;width:min(560px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.res{font-family:var(--f-disp);font-size:52px;text-align:center;line-height:1.1;transform:skewX(-9deg);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.res.win{color:var(--gold)}.res.lose{color:#9fb0d6}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--gold);color:var(--ink);border-radius:6px;padding:8px 16px;font-weight:900;font-size:14px;z-index:9;pointer-events:none;transition:opacity .3s;opacity:0;max-width:90vw;text-align:center}
.pchart{width:58px;height:58px;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <canvas id="cv" tabindex="0" aria-label="野球場"></canvas>
  <div id="hud" hidden>
    <div id="bug"></div>
    <div id="pc"></div>
    <div id="l3" class="off"></div>
    <div id="spd" class="off"></div>
    <div id="hint" class="hint"></div>
  </div>
  <div id="banner"></div>
  <div id="ctrl" hidden></div>
  <div id="screen"></div>
  <div id="modal" hidden></div>
  <div id="toast"></div>
</div>

<script>
'use strict';
/* ======================================================================
   utilities
   ====================================================================== */
const $=s=>document.querySelector(s);
const R=Math.random;
const rnd=(a,b)=>a+R()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;
const DEG=Math.PI/180;
function gauss(){let u=0,v=0;while(!u)u=R();while(!v)v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let uidN=1;const uid=()=>uidN++;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d2=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
let now=performance.now();

/* ======================================================================

function genBatter(S,pos,i,used){
  let meet=S+ri(-12,12),power=S+ri(-14,12),speed=S+ri(-15,15),def=S+ri(-12,12),arm=S+ri(-12,12);
  if(i>=2&&i<=4){power+=12;meet+=3;}

  if(pos==='右'||pos==='捕'||pos==='三')arm+=8;
  const traj=clamp(1+Math.floor((power+ri(-12,12))/32),1,4);
  return {id:uid(),name:nameFrom(used),pos,meet:cst(meet),power:cst(power),speed:cst(speed),def:cst(def),arm:cst(arm),traj,sk:[],cond:2,st:{pa:0,ab:0,h:0,hr:0,rbi:0}};
}
function genPitcher(S,used){
  const n=clamp(1+(S>42?1:0)+(S>58?1:0)+(S>74?1:0)+(R()<.3?1:0),1,4);
  const pitches=shuffle(BREAKS.slice()).slice(0,n).map(t=>({t,lv:clamp(Math.round(S/15+rnd(-1,1.2)),1,7)}));
  return {id:uid(),name:nameFrom(used),pos:'投',velo:Math.round(120+S*0.38+ri(-3,3)),ctrl:cst(S+ri(-8,8)),stam:cst(S+ri(-5,10)),pitches,sk:[],cond:2,speed:45,def:50,arm:60};
}

  const used=new Set();const S=44;

  p.velo=ri(132,136);p.ctrl=ri(46,54);p.stam=ri(52,60);
  p.pitches=[{t:'SL',lv:2},{t:pick(['CB','FK']),lv:1}];

function genOpp(S,kind){
  const used=new Set();
  const boss=kind==='boss'?BOSS[run.stage]:null;

  const batters=ORDERPOS.map((p,i)=>genBatter(S,p,i,used));
  const skp=kind==='normal'?.12:kind==='elite'?.3:.45;
  batters.forEach(b=>{if(R()<skp)b.sk.push(pick(['avg','pow','spd','clutch','arch','pull','glove']));});
  const pit=genPitcher(S+(kind==='boss'?3:0),used);

  return {name,ab:name.slice(0,2),c:boss?boss.c:pick(OPPCOL),batters,pitcher:pit,S,kind};
}

function genChoices(){

  const pool=[['match',34],['elite',13],['train',18],['event',15],['shop',10],['rest',10]];
  if(run.floor===FLOORS-1){pool[5][1]=22;pool[4][1]=20;}
  const n=R()<.35?2:3,out=[];let g=0;
  while(out.length<n&&g++<100){let tot=pool.reduce((s,p)=>s+p[1],0),r=R()*tot;for(const p of pool){r-=p[1];if(r<=0){if(!out.includes(p[0]))out.push(p[0]);break;}}}

  if(hasS(b,'spd'))speed+=12;if(hasS(b,'g_spd'))speed+=25;
  return {meet,power,speed,traj:clamp(b.traj+(hasS(b,'arch')?1:0),1,4)};
}
function oppB(b){
  let meet=b.meet,power=b.power,speed=b.speed;
  if(hasS(b,'avg'))meet+=8;if(hasS(b,'pow'))power+=12;if(hasS(b,'spd'))speed+=12;
  if(hasS(b,'clutch')&&M&&risp()){meet+=8;power+=8;}
  return {meet,power,speed,traj:clamp(b.traj+(hasS(b,'arch')?1:0),1,4)};

function fatigue(side){

    const pl=i===0?team.pitcher:(team.batters.find(b=>POS2F[b.pos]===i)||team.batters[0]);
    const def=(pl.def??50)+(mine&&has('glove')?10:0)+(hasS(pl,'glove')?12:0),arm=(pl.arm??55)+(hasS(pl,'laser')?15:0);
    const spd=(pl.speed??50);const of=i>=6;
    let x=p[0],z=p[1];
    if(bunt){if(i===2){x=13;z=13;}if(i===4){x=-13;z=13;}}

}
function reachT(f,d,air){const r=Math.max(0,d-f.reach);const a=4.2,dv=f.v*f.v/(2*a);return (air?f.reactAir:f.react)+(r<dv?Math.sqrt(2*r/a):f.v/a+(r-dv)/f.v);}

/* resolvePlay: decides the whole play from physics and returns an animation script + result */
function resolvePlay(bb,bat,side,bunt){
  const F=fieldersFor(side,bunt);const fl=simFlight(bb);const S=fl.S;
  const P={S,F,throws:[],fm:{},runs:[],ballEnd:S[S.length-1].t,holder:-1,dur:2};
  const outs0=M.outs;const bases=M.bases.slice();
  let best=null;
  outer:for(let i=0;i<S.length;i++){
    const s=S[i];if(s.t<0.12)continue;
    const dc=Math.hypot(s.x,s.z);if(dc>wallR(Math.atan2(s.x,s.z)/DEG)-0.5)continue;
    if(s.air?s.y>2.6:s.y>1.15)continue;
    let c=null;
    for(const f of F){const need=reachT(f,Math.hypot(f.x-s.x,f.z-s.z),s.air);if(need<=s.t&&(!c||need<c.need))c={f,need};}
    if(c){best={i,s,f:c.f,need:c.need,t:s.t,air:s.air};break outer;}
  }
  const vB=runSpd(bat,side);const bRunner={pl:bat,sp:vB};
  const moveF=(fi,to,t0,t1)=>{const f=F[fi];const arr=P.fm[fi]=P.fm[fi]||[];arr.push({t0,t1:Math.max(t0+0.05,t1),from:arr.length?arr[arr.length-1].to:[f.x,f.z],to});};
  const chase=b=>{const f=b.f;const d=Math.hypot(f.x-b.s.x,f.z-b.s.z);moveF(f.i,[b.s.x,b.s.z],f.react*0.8,Math.min(b.t,f.react*0.8+d/f.v));P.ballEnd=b.t;P.holder=f.i;};
  const addRun=(k,m,t0,sp,out,tOut)=>P.runs.push({s0:k*BL+(k>0?3:0),s1:m*BL,t0,sp,out,tOut});
  const endT=()=>Math.max(P.ballEnd,...P.throws.map(t=>t.t1),...P.runs.map(r=>r.out?r.tOut:r.t0+(r.s1-r.s0)/r.sp))+0.7;
  const res={code:'',text:'',outs:0,runs:0,rbi:0,bases:[null,null,null],batterBase:0,kind:''};

  let foul=false;

    res.outs=1;

        if(tr<tt+0.9){const safe=tr<tt+0.35+gauss()*0.35;addRun(3,4,best.t+0.15,r.sp,!safe,tt);moveF(1,[0,-0.6],0.3,1);P.throws.push({from:[best.s.x,best.s.z],to:BP[0],t0:best.t+0.6,t1:tt,rcv:1});
          nb[2]=null;if(safe){runs++;res.text+='（犠牲フライ）';res.code='SF';}else{res.outs++;res.text+='　タッチアップもホームでアウト！';}}}
      if(bases[1]&&!nb[2]&&dc>70&&outs0+res.outs<3){const r=bases[1];const tr=best.t+0.15+BL/r.sp;const tt=best.t+0.6+d2([best.s.x,best.s.z],BP[3])/best.f.arm;if(tr<tt){addRun(2,3,best.t+0.15,r.sp,false);nb[2]=r;nb[1]=null;}}
    }
    res.runs=outs0+res.outs<3?runs:0;res.rbi=res.runs;res.bases=nb;
    P.dur=endT();P.res=res;return P;
  }

  const groundBall=best&&!best.air&&best.f.i<=5&&(!fl.land||Math.hypot(fl.land.x,fl.land.z)<30);
  if(groundBall){
    chase(best);
    const f=best.f,tf=best.t,pt=[best.s.x,best.s.z];
    const tB1=(bunt?0.62:0.45)+BL/vB;
    const nb=bases.slice();let outs=0,runs=0;
    const fk=bases[0]?(bases[1]?(bases[2]?3:2):1):0;
    const errP=0.034-(f.pl.def??50)*0.00028;
    res.kind='ground';
    if(R()<errP){
      const rcv=coverer(1,f.i);const tt=tf+0.6+d2(pt,BP[1])/f.arm;moveF(rcv,BP[1],0.3,Math.max(0.6,tt-0.2));P.throws.push({from:pt,to:[BP[1][0]+3,BP[1][1]+4],t0:tf+0.6,t1:tt,rcv:-1});
      for(let k=3;k>=1;k--){const r=bases[k-1];if(!r)continue;if(k===3){addRun(3,4,0.3,r.sp,false);runs++;nb[2]=null;}else if(k<=fk){addRun(k,k+1,0.3,r.sp,false);nb[k]=r;nb[k-1]=null;}}
      addRun(0,1,0.45,vB,false);nb[0]=bRunner;
      Object.assign(res,{code:'E',text:`${FNAME[f.i]}のエラー！`,runs,rbi:0,bases:nb,batterBase:1});
      P.dur=endT();P.res=res;return P;
    }

      else{tt=tf+0.55+d2(pt,BP[1])/f.arm;moveF(rcv,BP[1],0.3,Math.max(0.6,tt-0.2));P.throws.push({from:pt,to:BP[1],t0:tf+0.55,t1:tt,rcv});}

      for(let k=lr-1;k>=1;k--){addRun(k,k+1,0.25,bases[k-1].sp,false);nb[k]=bases[k-1];nb[k-1]=null;}
      if(dp){outs++;addRun(0,1,bunt?0.62:0.45,vB,true,P.throws[P.throws.length-1].t1);}
      else{addRun(0,1,0.45,vB,false);nb[0]=bRunner;}
      if(fk<3&&bases[2]&&outs0+outs<3&&R()<0.4){addRun(3,4,0.3,bases[2].sp,false);runs++;nb[2]=null;}
      res.text=dp?`${f.i+1}-${piv+1}-3のゲッツー`:`${FNAME[f.i]}ゴロ　${BASEN[tgt]}フォースアウト`;

    }else if(batOut){

      let adv=false;

        if(k<=fk){addRun(k,k+1,0.25,r.sp,false);if(k===3)runs++;else nb[k]=r;nb[k-1]=null;adv=true;}
        else if(k===3&&outs0<2&&f.i!==0&&f.i!==1&&f.i!==4&&R()<0.55){addRun(3,4,0.25,r.sp,false);runs++;nb[2]=null;adv=true;}

    (best&&best.f.i<=5?`${FNAME[best.f.i]}の後方へポトリ`:fl.land&&Math.hypot(fl.land.x,fl.land.z)<55&&fl.maxY>6?`${hitDir(pt[0],pt[1])}前にポトリ`:`${hitDir(pt[0],pt[1])}前ヒット`);

  P.dur=endT();P.res=res;return P;
}

const BALLR=0.037,ZX=0.216,ZY=0.30,ZC=0.8;

let M=null;
function risp(){return !!(M&&(M.bases[1]||M.bases[2]));}
function startMatch(kind){

  const opp=genOpp(S,kind);
  M={kind,opp,inning:1,half:0,maxInn:3,limit:kind==='boss'?9:5,score:[0,0],line:[[],[]],outs:0,b:0,s:0,bases:[null,null,null],
     idx:[0,0],pc:[0,0],hits:[0,0],hrs:[0,0],phase:'idle',mode:null,strong:false,bunt:false,luckyUsed:false,nextMood:false,paMood:false,
     cursor:{x:0,y:-0.02},aim:{x:0,y:-0.05},ptype:'FB',ball:null,timer:null,play:null,swingAnim:0,cpuSwingAnim:0,over:false,lastEv:null,windT:0,mark:null,gauge:null,chanceShown:false};

function curBatter(){return M.half===1?run.team.batters[M.idx[1]]:M.opp.batters[M.idx[0]];}
function teamOf(side){return side===1?{name:MY.name,ab:MY.ab,c:MY.c}:{name:M.opp.name,ab:M.opp.ab,c:M.opp.c};}

function beginHalf(){
  M.outs=0;M.b=0;M.s=0;M.bases=[null,null,null];M.ball=null;M.play=null;M.chanceShown=false;
  M.line[M.half][M.inning-1]=0;

}
function newPA(){
  M.phase='intro';M.paMood=M.nextMood;M.nextMood=false;M.bunt=false;
  buildCtrl();renderHUD();showL3();
  const mine=M.half===1;
  if(risp()&&!M.chanceShown){M.chanceShown=true;banner(mine?'チャンス！':'ピンチ！',mine?'得点圏にランナー':'踏ん張りどころだ',mine?'chance':'pinch',1200);if(mine)music('chance');wait(1300,readyPitch);return;}

function halfOver(){

function endHalf(){
  const diff=M.score[1]-M.score[0];
  if(M.half===0){
    if(M.inning>=M.maxInn&&diff>0)return endGame();
    if(M.inning>=2&&diff>=10)return endGame(true);
    M.half=1;beginHalf();
  }else{
    if(M.inning>=M.maxInn&&diff!==0)return endGame();
    if(M.inning>=M.limit)return endGame();

  }

const walkoff=()=>M.half===1&&M.inning>=M.maxInn&&M.score[1]>M.score[0];

/* pitch generation */
function cpuPitch(pit,side){
  const st=effP(pit,side===0);
  const types=['FB',...pit.pitches.map(q=>q.t)];
  const w=types.map((t,i)=>i===0?(M.b>=3?2.6:1.25):0.35+pit.pitches[i-1].lv*0.22);
  let r=R()*w.reduce((a,b)=>a+b,0),ti=0;for(;ti<w.length;ti++){r-=w[ti];if(r<=0)break;}
  const type=types[Math.min(ti,types.length-1)];
  const zp=0.36+st.ctrl*0.0035+(M.b>=3?0.22:0)-(M.s===2&&M.b<2?0.2:0);
  let tx,ty;
  if(R()<zp){tx=(R()<.5?-1:1)*Math.pow(R(),0.7)*0.19;ty=(R()<.5?-1:1)*Math.pow(R(),0.7)*0.27;}
  else{const q=R();
    if(q<.35){tx=(R()<.5?-1:1)*(ZX+rnd(0.05,0.14));ty=rnd(-0.25,0.25);}
    else if(q<.8||type==='FK'||type==='CB'){ty=-ZY-rnd(0.05,0.16);tx=rnd(-0.2,0.2);}
    else{ty=ZY+rnd(0.05,0.14);tx=rnd(-0.2,0.2);}}
  return makePitch(pit,side,type,tx,ty,1);
}
function makePitch(pit,side,type,tx,ty,gaugeMul){
  const st=effP(pit,side===0);const f=fatigue(side);
  let sc=(0.015+(100-st.ctrl)*0.0009)*(1+f*0.8)*(gaugeMul||1);
  if(hasS(pit,'prec'))sc*=.65;if(hasS(pit,'g_ctrl'))sc*=.4;
  const x=tx+gauss()*sc,y=ty+gauss()*sc;
  const def=PT[type];const pq=pit.pitches.find(q=>q.t===type);const lv=pq?pq.lv:0;
  const km=(hasS(pit,'kire')?1.2:1)*(hasS(pit,'g_kire')?1.35:1)*lv*0.042;
  const v=Math.round(st.velo+def.dv-f*8+gauss()*1.2+(gaugeMul&&gaugeMul<0.7?2:0));
  return {type,lv,x,y,v,brk:{x:def.bx*km,y:-def.by*km},arc:def.arc};
}
function travelMs(v,type,pit){
  let t=(18.44/(v/3.6))*1000*1.95;
  if(M.mode==='bat'){if(has('cam'))t*=1.1;if(type==='FB'&&(hasS(pit,'nobi')||hasS(pit,'g_nobi')))t*=.94;}
  return t;
}
const REL={x:-0.45,y:1.85,z:17.0};

/* CPU batter response (also used for auto batting) */
function cpuResponse(bat,pit,pc,side){
  const st=statB(bat,side);
  if(side===1){if(hasS(bat,'avg'))st.meet+=8;if(hasS(bat,'g_hit'))st.meet+=14;if((hasS(bat,'clutch')||hasS(bat,'g_clutch'))&&risp()){st.meet+=8;st.power+=8;}if(has('mega')&&M.inning>=M.maxInn){st.meet+=8;st.power+=6;}}
  const inZ=isStrike(pc.x,pc.y);
  const edge=inZ?Math.max(Math.abs(pc.x)/ZX,Math.abs(pc.y)/ZY):1;
  const brk=pc.type!=='FB';
  let pq=clamp((pc.v-118)/40,0,1)*0.6+(brk?pc.lv/7*0.55:0);
  if(!brk&&hasS(pit,'nobi'))pq+=.12;if(!brk&&hasS(pit,'g_nobi'))pq+=.15;
  if(brk&&hasS(pit,'kire'))pq+=.1;if(brk&&hasS(pit,'g_kire'))pq+=.16;
  if(risp()&&hasS(pit,'pinch'))pq+=.12;
  let sw=inZ?0.62+0.12*M.s:0.13+0.1*M.s+(brk?0.06:0)-(st.meet-50)*0.002;
  if(M.b===3&&!inZ)sw-=0.1;
  if(R()>sw)return {kind:'take',strike:inZ,swing:false};
  let cp=0.9+(st.meet-50)*0.005-pq*0.32-(inZ?edge*0.1:0.28);
  if(M.s===2&&hasS(pit,'kk'))cp-=.08;
  if(R()>cp){
    if(side===1&&M.s===2&&has('lucky')&&!M.luckyUsed){M.luckyUsed=true;return {kind:'foul',swing:true,lucky:true};}
    return {kind:'miss',swing:true};
  }
  const q=clamp(0.66+(st.meet-50)*0.006-pq*0.22-(inZ?edge*0.12:0.25)+gauss()*0.27,0,1);
  const td=gauss()*0.55;const tq=1-Math.min(1,Math.abs(td))**2;
  const dy=(R()+R()-1)*0.95;
  if(q<0.16&&R()<0.6)return {kind:'foul',swing:true,tip:true};
  const bb=toBB(q,tq,dy,td*100,100,st.power,st.traj,(hasS(pit,'heavy')?.88:1)*(hasS(pit,'g_nobi')&&!brk?.92:1),bat);
  return {kind:'inplay',swing:true,bb};
}
function toBB(pq,tq,dyn,dms,Wms,P,traj,evMul,bat){
  const evq=clamp((0.28+0.72*pq)*(0.55+0.45*tq)*(evMul||1),0.05,1.05);
  let v0=15+evq*(23+P*0.13);
  const la=12+(traj-2)*3.5+dyn*55+gauss()*5;
  const phi=clamp((dms/Wms)*48+gauss()*6,-95,95);
  if(bat&&hasS(bat,'pull')&&phi<-10)v0*=1.04;
  return {v0,la,phi,evq};
}

/* applying outcomes */
function paDone(ev,bat){
  ev.paEnd=true;M.b=0;M.s=0;
  if(ev.runs){M.score[M.half]+=ev.runs;M.line[M.half][M.inning-1]=(M.line[M.half][M.inning-1]||0)+ev.runs;}
  if(M.half===1&&bat.st){const s=bat.st;s.pa++;if(!['BB','SAC','SF'].includes(ev.code))s.ab++;if(['1B','2B','3B','HR','IHR'].includes(ev.code))s.h++;if(ev.code==='HR'||ev.code==='IHR'){s.hr++;run.hr++;}s.rbi+=ev.rbi||0;}
  M.idx[M.half]=(M.idx[M.half]+1)%9;
  return ev;
}
function applyPitch(o,bat,bunt){
  const side=M.half;M.pc[side===1?1:0]++;
  if(o.kind==='take'&&!o.strike){M.b++;if(M.b>=4){
    let runs=0;const b=M.bases;const r={pl:bat,sp:runSpd(bat,side)};
    if(b[0]){if(b[1]){if(b[2])runs++;b[2]=b[1];}b[1]=b[0];}b[0]=r;
    return paDone({type:'BB',code:'BB',text:'フォアボール',runs,rbi:runs},bat);}
    return {type:'ball',text:'ボール'};}
  if(o.kind==='take'||o.kind==='miss'){M.s++;if(M.s>=3){M.outs++;return paDone({type:'K',code:'K',text:o.kind==='take'?'見逃し三振':'空振り三振',runs:0},bat);}return {type:'strike',text:o.kind==='take'?'ストライク':'空振り'};}
  if(o.kind==='foul'){if(bunt&&M.s===2){M.outs++;return paDone({type:'K',code:'K',text:'スリーバント失敗',runs:0},bat);}if(M.s<2)M.s++;return {type:'foul',text:o.lucky?'ラッキーボール！':'ファウル'};}
  const P=o.play||resolvePlay(o.bb,bat,side,bunt);const res=P.res;
  if(res.code==='F'){if(bunt&&M.s===2){M.outs++;return paDone({type:'K',code:'K',text:'スリーバント失敗',runs:0,play:P,foulPlay:true},bat);}if(M.s<2)M.s++;return {type:'foul',text:'ファウル',play:P,foulPlay:true};}
  M.outs+=res.outs;
  M.bases=res.code==='HR'?[null,null,null]:res.bases;
  if(['1B','2B','3B','HR','IHR'].includes(res.code)){M.hits[side]++;if(side===1&&hasS(bat,'mood'))M.nextMood=true;}
  if(res.code==='HR'||res.code==='IHR')M.hrs[side]++;
  return paDone({type:'inplay',code:res.code,text:res.text,runs:res.runs,rbi:res.rbi,play:P},bat);
}
function simPA(bat,pit,side){
  let ev,g=0;
  do{const pc=cpuPitch(pit,side===1?1:0);const o=cpuResponse(bat,pit,pc,side);ev=applyPitch(o,bat);}while(!ev.paEnd&&++g<40);
  return ev;
}
function autoHalf(){
  const lines=[];let g=0;const start=M.score[0];
  while(M.outs<3&&g++<40){const bat=M.opp.batters[M.idx[0]];const ev=simPA(bat,run.team.pitcher,0);lines.push(`${esc(bat.name)}：${esc(ev.text)}${ev.runs?` <b>${ev.runs}点</b>`:''}`);}
  const runs=M.score[0]-start;
  M.phase='modal';renderHUD();
  modal(`<h3>${M.inning}回表　${esc(M.opp.name)}の攻撃</h3>
    <div class="res ${runs?'lose':'win'}" style="font-size:36px">${runs?runs+'点を失った':'無失点！'}</div>
    <div class="log">${lines.join('<br>')}</div>
    <button class="btn" data-a="${A(()=>{closeModal();halfOver();})}">次へ</button>`);
}

/* live pitch from CPU (batting) */
function startCpuPitch(){
  const pit=M.opp.pitcher;const pc=cpuPitch(pit,1);
  M.ball={...pc,t0:now,dur:travelMs(pc.v,pc.type,pit),z:0,state:'fly'};
  M.phase='flight';M.swung=false;M.swungMiss=false;
  if(has('note'))showSpd(null,PT[pc.type].n);
}
function curRadius(bat){
  let r=0.05+effB(bat).meet*0.0006;
  if(hasS(bat,'avg'))r*=1.15;if(hasS(bat,'g_hit'))r*=1.28;
  if(hasS(bat,'first')&&M.b===0&&M.s===0)r*=1.2;
  if(hasS(bat,'two')&&M.s===2)r*=1.15;
  if(hasS(bat,'clutch')&&risp())r*=1.12;if(hasS(bat,'g_clutch')&&risp())r*=1.25;
  if(M.paMood)r*=1.12;
  if(has('mega')&&M.inning>=M.maxInn)r*=1.12;
  const op=M.opp.pitcher;
  if(hasS(op,'kk')&&M.s===2)r*=.92;
  if(hasS(op,'pinch')&&risp())r*=.92;
  if(M.strong&&!M.bunt)r*=.72;
  if(M.bunt)r*=1.25*(hasS(bat,'bunt')?1.4:1);
  return r;
}
const swingW=bat=>115*(hasS(bat,'spray')?1.3:1);
function cursorRxRy(bat){const cr=curRadius(bat);return M.bunt?[cr*1.6+BALLR,cr*0.55+BALLR]:[cr*1.3+BALLR,cr*0.9+BALLR];}
function doSwing(){
  if(!M||M.mode!=='bat'||M.phase!=='flight'||M.swung||!M.ball||M.ball.state!=='fly'||M.bunt)return;
  M.swung=true;M.swingAnim=now;sfx('swish');
  const b=M.ball,bat=curBatter(),W=swingW(bat);
  const d=now-(b.t0+b.dur);
  const [rx,ry]=cursorRxRy(bat);
  const dx=b.x-M.cursor.x,dy=b.y-M.cursor.y;
  const e=Math.hypot(dx/rx,dy/ry);
  if(Math.abs(d)>W||e>1){M.swungMiss=true;return;}
  const core=0.3*(has('bat')?1.5:1);
  const pq=e<core?1:1-(e-core)/(1-core);
  const tq=1-Math.pow(Math.abs(d)/W,2);
  const st=effB(bat);let P=st.power+(M.strong?22:0);
  if(hasS(bat,'clutch')&&risp())P+=8;if(hasS(bat,'g_clutch')&&risp())P+=15;
  if(has('mega')&&M.inning>=M.maxInn)P+=6;
  if(pq<0.16&&R()<0.6){contact(null,'foul',pq,bat);return;}
  const op=M.opp.pitcher;
  const bb=toBB(pq,tq,dy/ry,d,W,P,st.traj,(hasS(op,'heavy')?.88:1)*(hasS(op,'g_nobi')&&b.type==='FB'?.92:1),bat);
  contact(bb,'inplay',pq,bat);
}
function buntContact(){
  const b=M.ball,bat=curBatter();const [rx,ry]=cursorRxRy(bat);
  const e=Math.hypot((b.x-M.cursor.x)/rx,(b.y-M.cursor.y)/ry);
  if(e>1)return false;
  const good=hasS(bat,'bunt');
  const bb={v0:rnd(7,good?11:14),la:rnd(-12,good?2:10),phi:clamp((b.x-M.cursor.x)/rx*40+gauss()*14,-70,70),evq:.2};
  if(R()<(good?0.12:0.25))bb.phi=(R()<.5?-1:1)*rnd(50,80);
  contact(bb,'inplay',0.3,bat,true);return true;
}
function contact(bb,kind,q,bat,bunt){
  const b=M.ball;b.state='hit';b.hitT=now;
  sfx(bunt?'bunt':'hit',q);M.shake=now;
  markPitch(b);showSpd(b.v,PT[b.type].n);
  let o;
  if(kind==='foul')o={kind:'foul'};
  else{const P=resolvePlay(bb,bat,M.half,bunt);o={kind:'inplay',play:P,bb};}
  const ev=applyPitch(o,bat,bunt);
  if(ev.play)startPlay(ev);else afterEv(ev);
}
function startPlay(ev){
  M.lastEv=ev;M.phase='play';M.ball=null;
  M.play={P:ev.play,t0:now,spd:1,ev,shown:false,tAcc:0};
  setView('follow');hideL3();
}
function afterEv(ev){
  M.lastEv=ev;M.phase='after';
  if(M.ball&&M.ball.state==='fly')M.ball.state='caught';
  renderHUD();
  if(ev.type==='K'){banner('三振',ev.text,M.half===1?'out2':'k',1100);sfx(M.half===1?'bad':'good');}
  else if(ev.type==='BB'){banner('フォアボール','','chg',900);}
  else{M.callText={t:ev.text,t0:now};sfx('mitt',ev.type==='ball'?.4:1);}
  wait(ev.paEnd?1250:800,nextStep);
}
function finishPlay(){
  const ev=M.play.ev;M.play=null;
  const c=ev.code;const mine=M.half===1;
  let cls='out2',main='アウト';
  if(ev.foulPlay&&ev.type==='foul'){M.phase='after';M.callText={t:'ファウル',t0:now};setView(M.mode==='bat'?'bat':'pitch');renderHUD();wait(500,nextStep);return;}
  if(c==='HR'||c==='IHR'){cls='hr';main=c==='HR'?'ホームラン!!':'ランニングHR!!';}
  else if(c==='1B'){cls='hit';main='ヒット！';}
  else if(c==='2B'){cls='hit';main='ツーベース！';}
  else if(c==='3B'){cls='hit';main='スリーベース！';}
  else if(c==='E'){cls='hit';main='エラー！';}
  else if(c==='DP'){main='ゲッツー';}
  else if(c==='SAC'){main='送りバント';}
  else if(c==='SF'){main='犠牲フライ';}
  else if(c==='K'){cls='k';main='三振';}
  banner(main,ev.text,cls,c==='HR'?2200:1600,ev.runs?`${ev.runs}点${mine?'追加！':'失点'}`:'');
  if(c==='HR'||c==='IHR'){sfx('cheer');fireworks();}
  else if(['1B','2B','3B','E'].includes(c))sfx(mine?'good':'bad');
  else sfx(mine?'bad':'good');
  if(ev.runs&&mine&&c!=='HR')sfx('cheer');
  M.phase='result';renderHUD();
  if(ev.paEnd)music(null);
  wait(c==='HR'?2300:1700,()=>{setView(M.mode==='bat'?'bat':'pitch');nextStep();});
}
function nextStep(){
  M.ball=null;M.callText=null;
  if(walkoff()){music(null);banner('サヨナラ！！',`${MY.name}の勝利`,'hr',2000);sfx('cheer');fireworks();M.phase='banner';wait(2100,()=>endGame());return;}
  if(M.outs>=3)return halfOver();
  if(M.lastEv&&M.lastEv.paEnd){if(!risp())M.chanceShown=false;newPA();}else readyPitch();
}
function autoPA(){
  if(!M||M.mode!=='bat'||!(M.phase==='windup'||M.phase==='intro'))return;
  M.timer=null;M.ball=null;
  const bat=curBatter();const ev=simPA(bat,M.opp.pitcher,1);
  if(ev.play&&ev.type==='inplay')startPlay(ev);else afterEv(ev);
}

/* live pitch (my pitcher) */
function pressThrow(){
  if(!M||M.mode!=='pitch')return;
  if(M.phase==='ready'){M.phase='gauge';M.gauge={t0:now,dur:1000};renderHUD();return;}
  if(M.phase==='gauge'&&!M.gauge.done)releaseGauge((now-M.gauge.t0)/M.gauge.dur);
}
function releaseGauge(u){
  const pit=run.team.pitcher;
  const w=0.08*(has('rosin')?1.5:1)*(hasS(pit,'g_ctrl')?1.4:1);
  const err=Math.abs(u-0.8);
  const mul=err<w?0.55:err<w*2.5?1:1.7;
  M.gauge={...M.gauge,done:true,mul,u,res:err<w?'ナイス！':err<w*2.5?'':'甘い…'};
  M.phase='windup';M.windT=now;renderHUD();
  const type=M.ptype,ax=M.aim.x,ay=M.aim.y;
  wait(700,()=>{
    const pc=makePitch(pit,0,type,ax,ay,mul);
    const bat=curBatter();const resp=cpuResponse(bat,pit,pc,0);
    if(resp.kind==='inplay')resp.play=resolvePlay(resp.bb,bat,0,false);
    M.ball={...pc,t0:now,dur:travelMs(pc.v,pc.type,pit),z:0,state:'fly',resp};
    M.phase='flight';
  });
}
function flightUpdate(){
  const b=M.ball;if(!b||b.state!=='fly')return;
  b.z=(now-b.t0)/b.dur;
  if(M.mode==='bat'){
    const bat=curBatter();
    if(M.bunt&&b.z>=1&&!M.swung){M.swung=true;M.swingAnim=now;if(buntContact())return;}
    if(M.swungMiss&&b.z>=1.05){M.swungMiss=false;let o={kind:'miss'};if(M.s===2&&has('lucky')&&!M.luckyUsed){M.luckyUsed=true;o={kind:'foul',lucky:true};}markPitch(b);showSpd(b.v,PT[b.type].n);afterEv(applyPitch(o,bat));return;}
    if(!M.swung&&now>=b.t0+b.dur+swingW(bat)){markPitch(b);showSpd(b.v,PT[b.type].n);
      afterEv(applyPitch({kind:'take',strike:isStrike(b.x,b.y)},bat));return;}
    if(M.bunt&&M.swung&&b.z>=1.05){markPitch(b);showSpd(b.v,PT[b.type].n);afterEv(applyPitch(isStrike(b.x,b.y)?{kind:'miss'}:{kind:'take',strike:false},bat,true));}
  }else{
    const r=b.resp;
    if(r.swing&&!M.cpuSwingAnim&&b.z>=0.84)M.cpuSwingAnim=now;
    if((r.kind==='foul'||r.kind==='inplay')&&b.z>=1){
      showSpd(b.v,PT[b.type].n);markPitch(b);b.state='hit';sfx('hit',r.play?0.7:0.3);M.shake=now;
      const ev=applyPitch(r,curBatter());
      if(ev.play)startPlay(ev);else afterEv(ev);return;
    }
    if(b.z>=1.05&&(r.kind==='take'||r.kind==='miss')){markPitch(b);showSpd(b.v,PT[b.type].n);afterEv(applyPitch(r,curBatter()));}
  }
}
function markPitch(b){M.mark={x:b.x,y:b.y,t0:now,strike:isStrike(b.x,b.y)};}

/* end of game */
function endGame(called){
  M.over=true;M.phase='over';M.timer=null;music(null);
  const [o,m]=M.score;const res=m>o?'win':m<o?'lose':'draw';M.res=res;
  hideHUD();setView('menu');
  modal(`<h3>VS ${esc(M.opp.name)}</h3>
    <div class="res ${res==='win'?'win':'lose'}">${res==='win'?(M.kind==='boss'?'優勝！':'勝利！'):res==='lose'?'敗戦…':'引き分け'}</div>
    ${lineScoreHTML()}
    <p class="mini">${called?'コールドゲーム　':''}ヒット ${M.hits[1]}本 ／ 本塁打 ${M.hrs[1]}本 ／ 被安打 ${M.hits[0]}</p>
    <button class="btn" data-a="${A(()=>{closeModal();postGame(res);})}">次へ</button>`);
}
function lineScoreHTML(){
  const n=Math.max(M.maxInn,M.inning);
  const cell=(side,i)=>{const v=M.line[side][i];return v===undefined?(side===1&&i===n-1&&M.over?'X':'-'):v;};
  let h='<div class="ls"><table><tr><td></td>';for(let i=0;i<n;i++)h+=`<td style="color:var(--muted);font-size:14px">${i+1}</td>`;h+='<td class="r" style="font-size:14px">R</td><td style="font-size:14px;color:var(--muted)">H</td></tr>';
  [[0,M.opp.ab],[1,MY.ab]].forEach(([s,nm])=>{h+=`<tr><td>${esc(nm)}</td>`;for(let i=0;i<n;i++)h+=`<td>${cell(s,i)}</td>`;h+=`<td class="r">${M.score[s]}</td><td>${M.hits[s]}</td></tr>`;});
  return h+'</table></div>';
}
function driftCond(win){run.team.batters.concat([run.team.pitcher]).forEach(p=>{const r=R();let d=0;if(r<0.22)d=-1;else if(r>(win?0.7:0.82))d=1;if(p.cond>3&&R()<.35)d=-1;if(p.cond<1&&R()<.35)d=1;p.cond=clamp(p.cond+d,0,4);});}
function postGame(res){
  const kind=M.kind;crowd(false);
  if(res==='win'){
    run.wins++;
    let coins=20+run.stage*10+(kind==='elite'?15:kind==='boss'?30:0)+M.score[1]*2;
    if(has('bank'))coins=Math.round(coins*1.4);
    run.coins+=coins;driftCond(true);
    let coachMsg='';
    if(has('coach')){const b=pick(run.team.batters);const k=pick(['meet','power','speed']);b[k]+=3;capStats();coachMsg=`名コーチの手帳：${b.name}の${STATN[k]}+3`;}
    M=null;showReward(kind,coins,coachMsg);
  }else if(res==='draw'&&kind!=='boss'){
    run.coins+=10;driftCond(false);M=null;toast('引き分け。部費+10');advanceFloor();
  }else{
    run.losses++;driftCond(false);
    if(kind==='boss'){M=null;return showGameOver('決勝戦で敗れ、夏が終わった。');}
    if(has('omamo')&&!run.omamoUsed){run.omamoUsed=true;run.items=run.items.filter(i=>i!=='omamo');M=null;toast('お守りが守ってくれた！信頼は減らない');advanceFloor();return;}
    run.hearts--;M=null;
    if(run.hearts<=0)return showGameOver('監督の信頼を失い、チームは解散した。');
    toast(`監督の信頼が下がった（残り${run.hearts}）`);advanceFloor();
  }
}

const STATN={meet:'ミート',power:'パワー',speed:'走力',def:'守備',arm:'肩力'};
function cardStat(big){
  const b=pick(run.team.batters);const k=pick(['meet','power','power','meet','speed','def','arm']);const v=big?ri(9,13):ri(6,9);

function cardRecruit(){

function genRewards(kind){
  const out=[];const big=kind!=='normal';
  const gens=[()=>cardStat(big),()=>cardSkill(big),()=>cardPitch(big),cardRecruit,cardItem,cardTraj];
  const w=[3,2.2,2.4,1.1,kind==='normal'?0.5:1.4,0.8];
  let g=0;
  while(out.length<3&&g++<40){let tot=w.reduce((a,b)=>a+b,0),r=R()*tot,i=0;for(;i<w.length;i++){r-=w[i];if(r<=0)break;}const c=gens[Math.min(i,gens.length-1)]();if(!out.some(o=>o.t===c.t))out.push(c);}
  if((kind==='elite'||kind==='boss')&&!out.some(c=>c.s==='具'||c.gold))out[2]=R()<.5?cardItem():cardSkill(true);
  return out;
}

let AC=null,crowdNode=null,musicT=0,musicOn=null;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function sfx(n,v=1){
  try{
    const C=ac();const t=C.currentTime;
    const tone=(f,d,type='sine',vol=.15,f2,dl=0)=>{const o=C.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t+dl);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dl+d);const g=C.createGain();g.gain.setValueAtTime(0.0001,t+dl);g.gain.linearRampToValueAtTime(vol,t+dl+0.01);g.gain.exponentialRampToValueAtTime(.0005,t+dl+d);o.connect(g);g.connect(C.destination);o.start(t+dl);o.stop(t+dl+d+.05);};
    const noise=(d,vol,freq,q=1,type='bandpass',dl=0,att=0.005)=>{const len=Math.floor(C.sampleRate*d);const buf=C.createBuffer(1,len,C.sampleRate);const a=buf.getChannelData(0);for(let i=0;i<len;i++)a[i]=(R()*2-1);const s=C.createBufferSource();s.buffer=buf;const f=C.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=C.createGain();g.gain.setValueAtTime(0.0001,t+dl);g.gain.linearRampToValueAtTime(vol,t+dl+att);g.gain.exponentialRampToValueAtTime(.0005,t+dl+d);s.connect(f);f.connect(g);g.connect(C.destination);s.start(t+dl);};
    if(n==='click')tone(1200,.04,'square',.03);
    else if(n==='swish')noise(.22,.3,1400,.6,'bandpass',0,.06);
    else if(n==='hit'){noise(.05,.9*v+.3,3200,1.2);tone(900+v*600,.06,'square',.12*v+.05,300);tone(140,.15,'triangle',.3,60);}
    else if(n==='bunt'){noise(.04,.4,1500,2);tone(300,.06,'triangle',.15,150);}
    else if(n==='mitt'){noise(.07,.6*v,420,1.6);tone(110,.1,'sine',.25*v,60);}
    else if(n==='good'){[523,659,784,1046].forEach((f,i)=>tone(f,.22,'triangle',.1,null,i*.07));}
    else if(n==='bad')tone(330,.4,'triangle',.1,160);
    else if(n==='cheer'){noise(2.4,.32,900,.35,'bandpass',0,.25);noise(2,.18,2200,.5,'bandpass',.1,.3);}
  }catch(e){}
}
function crowd(on){
  try{
    const C=ac();
    if(on&&!crowdNode){const len=C.sampleRate*3;const buf=C.createBuffer(1,len,C.sampleRate);const a=buf.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=l*0.97+(R()*2-1)*0.03;a[i]=l*3+(R()*2-1)*0.12;}
      const s=C.createBufferSource();s.buffer=buf;s.loop=true;const f=C.createBiquadFilter();f.type='lowpass';f.frequency.value=900;const g=C.createGain();g.gain.value=0.07;s.connect(f);f.connect(g);g.connect(C.destination);s.start();crowdNode={s,g};}
    else if(!on&&crowdNode){crowdNode.s.stop();crowdNode=null;}
  }catch(e){}
}
const CHANCE=[[0,67],[.25,67],[.5,72],[1,74],[1.5,76],[2,74],[2.25,76],[2.5,79],[3,76]];
function music(kind){
  clearInterval(musicT);musicOn=kind;
  if(!kind)return;
  const play=()=>{try{const C=ac();const t=C.currentTime;CHANCE.forEach(([dt,n])=>{const f=440*Math.pow(2,(n-69)/12);['sawtooth','square'].forEach((ty,j)=>{const o=C.createOscillator();o.type=ty;o.frequency.value=f*(j?1.003:1);const fl=C.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1800;const g=C.createGain();const st=t+dt*0.42;g.gain.setValueAtTime(0.0001,st);g.gain.linearRampToValueAtTime(.035,st+.03);g.gain.exponentialRampToValueAtTime(.001,st+.2);o.connect(fl);fl.connect(g);g.connect(C.destination);o.start(st);o.stop(st+.25);});});}catch(e){}};
  play();musicT=setInterval(()=>{if(musicOn)play();},1700);
}

/* ======================================================================
   3D camera engine (canvas)
   ====================================================================== */
const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const cam={pos:[0,30,-60],tgt:[0,0,50],fov:45,f:[0,0,1],r:[1,0,0],u:[0,1,0],foc:500};
let view='menu',viewCut=true,lastFollow=null;
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};
function camUpdate(){const f=norm(sub(cam.tgt,cam.pos));const r=norm(cross([0,1,0],f));const u=cross(f,r);cam.f=f;cam.r=r;cam.u=u;cam.foc=(H/2)/Math.tan(cam.fov*DEG/2);}
function toCam(p){const d=[p[0]-cam.pos[0],p[1]-cam.pos[1],p[2]-cam.pos[2]];return [dot(d,cam.r),dot(d,cam.u),dot(d,cam.f)];}
const NEAR=0.08;
function proj(p){const c=toCam(p);if(c[2]<NEAR)return null;const k=cam.foc/c[2];return {x:W/2+c[0]*k,y:H/2-c[1]*k,s:k,z:c[2]};}
function polyPath(pts){
  const cs=pts.map(toCam);const out=[];
  for(let i=0;i<cs.length;i++){const a=cs[i],b=cs[(i+1)%cs.length];const ai=a[2]>=NEAR,bi=b[2]>=NEAR;
    if(ai)out.push(a);
    if(ai!==bi){const t=(NEAR-a[2])/(b[2]-a[2]);out.push([lerp(a[0],b[0],t),lerp(a[1],b[1],t),NEAR]);}}
  if(out.length<3)return false;
  ctx.beginPath();
  out.forEach((c,i)=>{const k=cam.foc/c[2];const x=W/2+c[0]*k,y=H/2-c[1]*k;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});

}

const runPose=(t,k)=>({run:1,ph:t*k*9});

function batPose(swU,cur,strong,bunt,front){
  if(bunt){const hy=ZC+(cur?cur.y:0)+0.02;const hx=-0.5+(cur?cur.x:0)*0.3;return {h:[hx,hy,-0.02],t:[hx+0.8,hy+0.05,0.02],hands:[[hx,hy,-0.02],[hx+0.3,hy+0.02,0]]};}
  let a=-150,tilt=0.7,hx=-0.8,hy=1.32,hz=-0.12;
  if(swU>0){const u=clamp(swU,0,1);
    a=u<0.45?lerp(-150,-10,ease(u/0.45)):lerp(-10,120,(u-0.45)/0.55);
    tilt=u<0.45?lerp(0.7,0.05,u/0.45):lerp(0.05,0.65,(u-0.45)/0.55);
    const cy=ZC+(cur?cur.y:0)+0.1;
    hx=u<0.45?lerp(-0.8,-0.62,u/0.45):lerp(-0.62,-0.88,(u-0.45)/0.55);
    hy=u<0.45?lerp(1.32,cy,u/0.45):lerp(cy,1.35,(u-0.45)/0.55);
    hz=u<0.45?lerp(-0.12,0.05,u/0.45):lerp(0.05,0.3,(u-0.45)/0.55);}
  const L=0.9*(strong?1.05:1);
  const dir=norm([Math.cos(a*DEG)*(1-tilt),tilt,Math.sin(a*DEG)*(1-tilt)]);
  return {h:[hx,hy,hz],t:[hx+dir[0]*L,hy+dir[1]*L,hz+dir[2]*L],hands:[[hx,hy,hz],[hx+dir[0]*0.12,hy+dir[1]*0.12,hz+dir[2]*0.12]]};
}
function drawBat(bp,alpha){
  const a=proj(bp.h),b=proj(bp.t);if(!a||!b)return;
  ctx.save();if(alpha!=null)ctx.globalAlpha=alpha;ctx.lineCap='round';
  const w0=Math.max(2,0.035*a.s),w1=Math.max(3,0.065*b.s);
  for(let i=0;i<8;i++){const t0=i/8,t1=(i+1)/8;ctx.strokeStyle=i<2?'#3a2a20':'#d9a35e';ctx.lineWidth=lerp(w0,w1,t1);ctx.beginPath();ctx.moveTo(lerp(a.x,b.x,t0),lerp(a.y,b.y,t0));ctx.lineTo(lerp(a.x,b.x,t1),lerp(a.y,b.y,t1));ctx.stroke();}
  bp.hands.forEach(h=>{const p=proj(h);if(p){ctx.fillStyle=SKIN;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(2,0.08*p.s),0,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=1;ctx.stroke();}});
  ctx.restore();
}

/* ---------- ball ---------- */
function ballWorld(b,u){
  const uu=Math.min(u,1);const sx=b.x-b.brk.x,sy=b.y-b.brk.y;const bp=Math.pow(uu,2.3);
  return [lerp(REL.x,sx,u)+b.brk.x*bp, lerp(REL.y,ZC+sy,u)+b.brk.y*bp+b.arc*Math.sin(Math.PI*uu), REL.z*(1-u)];
}
function drawBall3(p3,glow){
  const p=proj(p3);if(!p)return;const r=Math.max(1.8,BALLR*p.s);
  const sh=proj([p3[0],0.02,p3[2]]);if(sh){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(sh.x,sh.y,r*1.1,r*0.35,0,0,7);ctx.fill();}
  if(glow){ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.arc(p.x,p.y,r*2.4,0,7);ctx.fill();}
  const g=ctx.createRadialGradient(p.x-r*0.35,p.y-r*0.35,r*0.1,p.x,p.y,r);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#d3d7df');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();
  if(r>5){ctx.strokeStyle='#d8303a';ctx.lineWidth=Math.max(1,r*0.12);ctx.beginPath();ctx.arc(p.x-r*1.05,p.y,r*0.8,-0.7,0.7);ctx.stroke();ctx.beginPath();ctx.arc(p.x+r*1.05,p.y,r*0.8,Math.PI-0.7,Math.PI+0.7);ctx.stroke();}
}

/* ---------- play playback ---------- */
function playT(pl){return pl.tAcc;}
function sampleS(S,t){if(t<=0)return [S[0].x,S[0].y,S[0].z];const i=Math.min(S.length-2,Math.floor(t/0.02));if(i<0)return [S[0].x,S[0].y,S[0].z];const a=S[i],b=S[i+1]||a;const u=b.t>a.t?clamp((t-a.t)/(b.t-a.t),0,1):0;return [lerp(a.x,b.x,u),lerp(a.y,b.y,u),lerp(a.z,b.z,u)];}
function fieldPos(P,i,t){const F=P.F[i];let p=[F.x,F.z];const m=P.fm[i];if(m)for(const s of m){if(t>=s.t0){const u=clamp((t-s.t0)/(s.t1-s.t0),0,1);p=[lerp(s.from[0],s.to[0],u),lerp(s.from[1],s.to[1],u)];}}return p;}
function fieldSeg(P,i,t){const m=P.fm[i];return m?m.find(s=>t>=s.t0&&t<s.t1):null;}
function playBall(pl){
  const P=pl.P,t=playT(pl);
  if(t<P.ballEnd||P.holder<0)return sampleS(P.S,Math.min(t,P.ballEnd));
  for(let k=P.throws.length-1;k>=0;k--){const th=P.throws[k];if(t>=th.t0){if(t<th.t1){const u=(t-th.t0)/(th.t1-th.t0);const dd=d2(th.from,th.to);return [lerp(th.from[0],th.to[0],u),1.4+Math.sin(u*Math.PI)*Math.min(6,dd*0.05),lerp(th.from[1],th.to[1],u)];}
    if(th.rcv<0)return [th.to[0],0.1,th.to[1]];const rp=fieldPos(P,th.rcv,t);return [rp[0],1.1,rp[1]];}}
  const hp=fieldPos(P,P.holder,t);return [hp[0],1.0,hp[1]];
}
function runnerPos(r,t){if(t<r.t0)return {s:r.s0,mv:false};const s=Math.min(r.s1,r.s0+(t-r.t0)*r.sp);return {s,mv:s<r.s1};}
function basePt(s){s=clamp(s,0,4*BL-0.01);const k=Math.floor(s/BL);const u=(s-k*BL)/BL;const a=BP[k],b=BP[(k+1)%4];return [lerp(a[0],b[0],u),lerp(a[1],b[1],u)];}

/* ---------- scene ---------- */
function drawScene(){
  drawStadium();
  const sp=[];
  const live=M&&!M.over;
  const atk=live?M.half:1,def=1-atk;
  const Ld=teamLook(def),La=teamLook(atk);
  const pl=live?M.play:null;
  const pt=pl?playT(pl):0;
  const defTeam=live?(def===1?run.team:M.opp):(run?run.team:null);
  for(let i=0;i<9;i++){
    if(i===0&&live&&!pl)continue;
    if(i===1&&isCC()&&!pl)continue;
    let x=FIELD[i][0],z=FIELD[i][1],pose={},yaw=Math.PI;
    if(pl){const p=fieldPos(pl.P,i,pt);x=p[0];z=p[1];const seg=fieldSeg(pl.P,i,pt);
      if(seg){pose=runPose(pt,1);yaw=Math.atan2(seg.to[0]-seg.from[0],seg.to[1]-seg.from[1]);}
      else{const b=playBall(pl);yaw=Math.atan2(b[0]-x,b[2]-z);pose=pl.P.holder===i&&pt>=pl.P.ballEnd?{hands:[[-0.36,-0.75,0,1],[0.36,-0.75,1]]}:{crouch:0.15};}}
    else if(i===1){pose={crouch:1,hands:[[-0.3,-0.55,0],[0.3,-0.62,1]]};
      if(live&&view==='pitch'){const ap=proj([M.aim.x,ZC+M.aim.y,-0.3]);const cp=proj([0,0,-1]);if(ap&&cp){pose.hands=[[-0.3,-0.5,0],[clamp((cp.x-ap.x)/cp.s,-0.8,0.8),(ap.y-cp.y)/cp.s,1]];}}}
    else pose={crouch:0.25,hands:[[-0.32,-0.62,0],[0.34,-0.6,1]]};
    const num=defTeam?(i===0?1:(defTeam.batters.findIndex(b=>POS2F[b.pos]===i)+1)||i+1):i+1;
    if(i===1&&!pl)yaw=0;
    const it=personAt(x,z,{look:Ld,pose,yaw,num,mask:i===1&&!pl});
    if(it)sp.push(it);
  }
  if(!isCC()||pl){const u=personAt(0,-2.2,{look:{cap:'#111',jersey:'#1a1d29',trim:'#1a1d29',pants:'#4a4f5c',socks:'#111',letter:'',acc:'#111'},pose:{crouch:0.4},yaw:0,mask:true});if(u)sp.push(u);}
  if(live&&!pl){
    const mine=M.mode==='pitch';let u=-1;
    if(M.phase==='windup')u=clamp((now-M.windT)/(mine?700:950),0,1)*0.98;
    else if((M.phase==='flight'||M.phase==='after')&&M.ball)u=clamp(1+(M.ball.z||0)*0.6,1,1.4);
    const front=true;const p=proj([0,0.25,18.2]);
    if(p)sp.push({d:p.z,draw:()=>drawPerson(p.x,p.y,p.s,{look:Ld,front,pose:pitcherPose(u,front),num:1})});
  }
  if(live&&!pl){
    M.bases.forEach((r,k)=>{if(!r)return;const bp=BP[k+1];const lead=[bp[0]+(k===0?-2.2:k===1?-2.4:1.6),bp[1]+(k===0?2.2:k===1?-1:-1.8)];const it=personAt(lead[0],lead[1],{look:La,helmet:true,pose:{crouch:0.3,hands:[[-0.35,-0.5,0],[0.35,-0.5,0]]},yaw:Math.PI/2});if(it)sp.push(it);});
  }
  if(pl){pl.P.runs.forEach(r=>{if(r.out&&pt>r.tOut+0.4)return;const rp=runnerPos(r,pt);const p=basePt(rp.s);const nx=basePt(Math.min(rp.s+1,4*BL-0.02));const yaw=Math.atan2(nx[0]-p[0],nx[1]-p[1]);
    const it=personAt(p[0],p[1],{look:La,helmet:true,pose:rp.mv?runPose(pt,1.2):{hands:[[-0.35,-0.7,0],[0.35,-0.7,0]]},yaw});if(it)sp.push(it);
    if(r.out&&pt>r.tOut&&pt<r.tOut+1){const q=proj([p[0],2.6,p[1]]);if(q)sp.push({d:q.z-1,draw:()=>txt('OUT',q.x,q.y,clamp(q.s*0.9,14,40),'#ff5a5a')});}});}
  if(live&&!pl&&!['banner','change','modal'].includes(M.phase)){
    const swingT=M.mode==='bat'?M.swingAnim:M.cpuSwingAnim;
    const swU=swingT&&now-swingT<520?(now-swingT)/300:0;
    const bunt=M.bunt&&M.mode==='bat';
    const bp=batPose(bunt?0:swU,M.mode==='bat'?M.cursor:null,M.strong&&M.mode==='bat',bunt);
    const p=proj([-1.0,0,0.12]);
    if(p)sp.push({d:p.z,draw:()=>{
      const front=!isCC();const twist=swU>0?Math.sin(clamp(swU,0,1)*Math.PI)*0.12:0;
      drawPerson(p.x,p.y,p.s,{look:La,front,helmet:true,num:M.idx[M.half]+1,alpha:isCC()?0.9:1,pose:{tilt:front?-twist:twist,stride:0.08,hands:[[0,0,2],[0,0,2]]}});
      drawBat(bp,isCC()?0.95:1);}});
  }
  if(live){
    if(pl){const b=playBall(pl);const p=proj(b);if(p)sp.push({d:p.z-0.01,draw:()=>drawBall3(b,true)});}
    else if(M.ball&&(M.ball.state==='fly'||M.ball.state==='caught')){const u=M.ball.state==='caught'?Math.min(M.ball.z,1.05):Math.min(M.ball.z,1.1);if(u>=0){const w=ballWorld(M.ball,u);const p=proj(w);
      if(p)sp.push({d:p.z-0.01,draw:()=>{for(let i=1;i<=3;i++){const q=proj(ballWorld(M.ball,Math.max(0,u-i*0.025)));if(q){ctx.fillStyle=`rgba(255,255,255,${0.16/i})`;ctx.beginPath();ctx.arc(q.x,q.y,Math.max(1.5,BALLR*q.s),0,7);ctx.fill();}}drawBall3(w);}});}}
  }
  sp.sort((a,b)=>b.d-a.d);
  sp.forEach(s=>s.draw());
}

/* ---------- 2D overlay ---------- */
function txt(t,x,y,size,col,stroke='#0a1533'){ctx.font=`900 ${size}px "M PLUS 1p",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size*0.18);ctx.strokeStyle=stroke;ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y);}
const zpt=(x,y)=>proj([x,ZC+y,0]);
function drawZone(){
  const a=zpt(-ZX,ZY),b=zpt(ZX,-ZY);if(!a||!b)return;
  ctx.save();ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.5;ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;for(let i=1;i<3;i++){const x=lerp(a.x,b.x,i/3),y=lerp(a.y,b.y,i/3);ctx.beginPath();ctx.moveTo(x,a.y);ctx.lineTo(x,b.y);ctx.moveTo(a.x,y);ctx.lineTo(b.x,y);ctx.stroke();}
  const L=Math.min(14,(b.x-a.x)*0.18);ctx.strokeStyle='#fff';ctx.lineWidth=3;[[a.x,a.y,1,1],[b.x,a.y,-1,1],[a.x,b.y,1,-1],[b.x,b.y,-1,-1]].forEach(([x,y,sx,sy])=>{ctx.beginPath();ctx.moveTo(x+sx*L,y);ctx.lineTo(x,y);ctx.lineTo(x,y+sy*L);ctx.stroke();});
  ctx.restore();
}
function drawCursor(){
  const bat=curBatter();const [rx,ry]=cursorRxRy(bat);const c=M.cursor;const p=zpt(c.x,c.y);if(!p)return;
  const core=0.3*(has('bat')?1.5:1);const s=p.s;
  const col=M.bunt?'110,220,255':M.strong?'255,80,60':'255,214,40';
  ctx.save();
  ctx.fillStyle=`rgba(${col},.2)`;ctx.strokeStyle=`rgba(${col},1)`;ctx.lineWidth=3;
  ctx.beginPath();ctx.ellipse(p.x,p.y,(rx-BALLR)*s,(ry-BALLR)*s,0,0,7);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(10,21,51,.55)';ctx.lineWidth=1;ctx.stroke();
  if(!M.bunt){const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,(rx-BALLR)*s*core*1.3);g.addColorStop(0,`rgba(${col},.95)`);g.addColorStop(1,`rgba(${col},.35)`);ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(p.x,p.y,(rx-BALLR)*s*core,(ry-BALLR)*s*core,0,0,7);ctx.fill();}
  else{ctx.strokeStyle=`rgba(${col},1)`;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x-(rx-BALLR)*s,p.y);ctx.lineTo(p.x+(rx-BALLR)*s,p.y);ctx.stroke();}
  ctx.restore();
}
function drawAim(){
  const c=M.aim;const p=zpt(c.x,c.y);if(!p)return;const r=Math.max(10,0.09*p.s);
  ctx.save();
  ctx.globalAlpha=M.phase==='flight'?0.75:1;
  ctx.fillStyle='#7a3f17';ctx.beginPath();ctx.ellipse(p.x,p.y,r*1.25,r*1.35,0,0,7);ctx.fill();
  ctx.fillStyle='#a8622c';ctx.beginPath();ctx.ellipse(p.x,p.y+r*0.1,r*0.85,r*0.9,0,0,7);ctx.fill();
  ctx.fillStyle='#5c2d10';[-0.6,-0.2,0.2,0.6].forEach(o=>{ctx.beginPath();ctx.ellipse(p.x+o*r,p.y-r*1.15,r*0.2,r*0.35,0,0,7);ctx.fill();});
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,r*0.35,0,7);ctx.stroke();
  ctx.globalAlpha=1;
  if(M.phase==='ready'&&M.ptype!=='FB'){const pit=run.team.pitcher;const q=pit.pitches.find(x=>x.t===M.ptype);if(q){const km=(hasS(pit,'kire')?1.2:1)*(hasS(pit,'g_kire')?1.35:1)*q.lv*0.042;const d=PT[M.ptype];const s=zpt(c.x-d.bx*km,c.y+d.by*km);if(s){ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(246,198,38,.95)';ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.quadraticCurveTo(s.x,lerp(s.y,p.y,0.3),p.x,p.y);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#f6c626';ctx.beginPath();ctx.arc(s.x,s.y,3,0,7);ctx.fill();}}}
  if(M.gauge){const g=M.gauge;const u=g.done?g.u:(now-g.t0)/g.dur;
    if(!g.done&&u>=1.15){releaseGauge(1.15);}
    const R0=r*4.5;const ring=Math.max(2,R0*(1-clamp(u,0,1.15)/1.15));const tgt=R0*(1-0.8/1.15);
    ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,tgt,0,7);ctx.stroke();
    ctx.strokeStyle=g.done?(g.mul<0.7?'#3fe27a':g.mul>1.2?'#ff5a5a':'#f6c626'):'#f6c626';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,ring,0,7);ctx.stroke();
    if(g.done&&g.res&&now-g.t0<g.dur+900)txt(g.res,p.x,p.y-tgt-16,18,g.mul<0.7?'#3fe27a':'#ff8a8a');}
  ctx.restore();
}
function drawMark(){
  const m=M.mark;if(!m||now-m.t0>1500)return;const p=zpt(m.x,m.y);if(!p)return;const a=1-Math.max(0,(now-m.t0-1000)/500);
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle=m.strike?'rgba(246,198,38,.9)':'rgba(120,200,255,.9)';ctx.strokeStyle='#0a1533';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(5,BALLR*p.s),0,7);ctx.fill();ctx.stroke();ctx.restore();
}
function drawEye(){const b=M.ball;if(!b||b.state!=='fly'||b.z<0.4)return;if(!hasS(curBatter(),'eye'))return;const p=zpt(b.x,b.y);if(!p)return;ctx.strokeStyle='rgba(126,224,255,.85)';ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(p.x,p.y,BALLR*p.s*1.2,0,7);ctx.stroke();ctx.setLineDash([]);}
let FW=[];
function fireworks(){for(let i=0;i<7;i++)FW.push({t0:now+i*230,x:rnd(.12,.88),y:rnd(.1,.38),c:pick(['#f6c626','#ff5d7a','#7ee0ff','#ffffff','#9cff7a'])});}
function drawFW(){FW=FW.filter(f=>{const u=(now-f.t0)/1200;if(u<0)return true;if(u>1)return false;ctx.fillStyle=f.c;ctx.globalAlpha=1-u;for(let i=0;i<28;i++){const a=i/28*Math.PI*2;const r=ease(Math.min(1,u*1.4))*Math.min(W,H)*0.17;ctx.beginPath();ctx.arc(f.x*W+Math.cos(a)*r,f.y*H+Math.sin(a)*r+u*u*40,2.6,0,7);ctx.fill();}ctx.globalAlpha=1;return true;});}
function drawOverlay(){
  if(!M||M.over||M.play)return;
  const ph=M.phase;
  if(M.mode==='bat'&&['windup','flight','intro','after'].includes(ph)){drawZone();drawEye();drawMark();drawCursor();}
  if(M.mode==='pitch'&&['ready','gauge','windup','flight','after','intro'].includes(ph)){drawZone();drawMark();drawAim();}
  if(M.callText&&now-M.callText.t0<850){const a=zpt(0,ZY+0.12);if(a)txt(M.callText.t,a.x,a.y-18,Math.min(30,W*0.07),M.callText.t==='ボール'?'#7ee0ff':'#ffffff');}
  if(M.mode==='bat'&&M.swingAnim&&now-M.swingAnim<200&&!M.bunt){const p=zpt(M.cursor.x,M.cursor.y);if(p){const u=(now-M.swingAnim)/200;ctx.strokeStyle=`rgba(255,255,255,${0.6*(1-u)})`;ctx.lineWidth=8;ctx.beginPath();ctx.ellipse(p.x-p.s*0.25,p.y,p.s*0.55,p.s*0.08,0,Math.PI*0.8,Math.PI*0.8+u*Math.PI*1.2);ctx.stroke();}}
}

/* ======================================================================
   main loop
   ====================================================================== */
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);viewCut=true;}
let last=performance.now();
function update(dt){
  if(!M||M.over)return;
  if(M.play){M.play.tAcc+=dt*M.play.spd;if(!M.play.shown&&M.play.tAcc>=M.play.P.dur){M.play.shown=true;finishPlay();}}
  const c=M.mode==='pitch'?M.aim:M.cursor;
  const canMove=M.mode==='bat'||M.phase==='ready';
  const ks=(has('gog')?1.4:1)*1.7;
  let vx=0,vy=0;
  if(keys['arrowleft']||keys['a'])vx-=1;if(keys['arrowright']||keys['d'])vx+=1;if(keys['arrowup']||keys['w'])vy+=1;if(keys['arrowdown']||keys['s'])vy-=1;
  if(canMove&&view!=='follow'){
    if(vx||vy){c.x+=vx*ks*dt;c.y+=vy*ks*dt;mouseT=null;}
    else if(mouseT){
      if(M.mode==='pitch'){c.x=mouseT.x;c.y=mouseT.y;}
      else{const sp=(has('gog')?1.4:1)*2.6*dt;const dx=mouseT.x-c.x,dy=mouseT.y-c.y,d=Math.hypot(dx,dy);if(d<=sp){c.x=mouseT.x;c.y=mouseT.y;}else{c.x+=dx/d*sp;c.y+=dy/d*sp;}}
    }
    clampC(c);
  }
  if(M.phase==='flight')flightUpdate();
  if(M.timer&&now>=M.timer.at){const f=M.timer.fn;M.timer=null;f();}
}
